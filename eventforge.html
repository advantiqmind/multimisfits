/* --- QoL polish (additive) --- */
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
textarea{transition:height .08s ease}
textarea.listItem{min-height:0;height:auto;resize:none;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
#charCount.warn{color:#e6b450;font-weight:700}#charCount.over{color:#b23a30;font-weight:800}
.nitro-toggle{padding:4px 8px;border:1px solid #3a2e1a;border-radius:6px;background:#1e1809;color:#a99b78;font-size:11px;font-weight:700;cursor:pointer;margin-right:6px;line-height:1}.nitro-toggle.active{border-color:#7289da;color:#7289da;background:rgba(114,137,218,.12)}
/* --- Feature update: required fields, recurrence, touch targets --- */
.req{color:#e06050;font-weight:900}
.missingField{border-color:var(--danger)!important;box-shadow:0 0 0 2px rgba(178,58,48,.28)!important}
.mentionChip{background:#3d4270;color:#c9cdfb;border-radius:3px;padding:0 3px;font-weight:600}
/* header show-block / show-label toggles */
.hdrCtl{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.hdrTogs{display:flex;align-items:center;gap:12px;margin-right:4px}
.hTog{display:flex;align-items:center;gap:5px;font-size:13px;color:#a99b78;cursor:default}
.hTog .tIco{font-style:normal;font-size:13px}
.hdrTogs .switch{width:36px;height:20px}
.hdrTogs .slider:after{width:14px;height:14px;left:3px;top:3px}
.hdrTogs .switch input:checked+.slider:after{transform:translateX(16px)}
.hdrDel{font-size:15px}
.hdrDel.arm{background:#2a1510;color:#e06050;font-size:12px;font-weight:800}
@media(max-width:900px){
.blockTop{flex-wrap:wrap}
.blockTitle{min-width:0;overflow:hidden}
.blockTitle small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.hdrCtl{order:5;flex:1 0 100%;padding-top:4px;gap:8px}
.hdrCtl .moveUp{margin-left:auto}
.hdrTogs{gap:16px}
.hdrTogs .switch{width:44px;height:24px}
.hdrTogs .slider:after{width:18px;height:18px}
.hdrTogs .switch input:checked+.slider:after{transform:translateX(20px)}
}
@media(max-width:900px){.btn,.mini,.seg button,.postType button,.importance button,.field input,.field select{min-height:44px}.emojiBtn,.iconBtn{min-height:44px;min-width:44px}.formatBar button{min-height:44px;min-width:44px}.backBtn{width:44px;height:44px}
/* mobile nav: the tab row was hidden under 900px, leaving Events/Templates/Settings unreachable on phones */
.brandrow{flex-wrap:wrap}.nav{display:flex;width:100%;margin-left:0;margin-top:8px}.nav button{flex:1;min-height:44px;padding:9px 0;font-size:11px;white-space:nowrap}
/* collapsible nav toggle on mobile */
.nav-toggle{display:none;width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;font-weight:700;font-size:12px;text-align:left;min-height:44px;cursor:pointer;align-items:center;justify-content:space-between;margin-top:8px}
.nav-toggle .chevron{transition:transform .15s}
.nav-toggle.open .chevron{transform:rotate(180deg)}
.nav-toggle{display:flex}
.nav.collapsed{display:none!important}
}
@media(min-width:901px){.nav-toggle{display:none}}
.pedit{border-bottom:1px dashed rgba(255,255,255,.15);outline:none;min-width:20px;display:inline;cursor:text}
.pedit:hover{border-bottom-color:rgba(255,203,47,.5);background:rgba(255,203,47,.06)}
.pedit:focus{border-bottom-color:#ffcb2f;background:rgba(255,203,47,.12);border-radius:2px}
.pedit:empty::before{content:attr(data-ph);color:#555;font-style:italic}
.pedit-ml{display:block;white-space:pre-wrap;min-height:1.4em}
/* --- armoury nav --- */
.arm-nav{display:flex;align-items:center;padding:10px 20px;background:#0f0c07;border-top:1px solid #3a2e1a;border-bottom:1px solid #3a2e1a;gap:16px;flex-wrap:wrap}
.arm-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.arm-brand img{width:28px;height:28px}
.arm-brand span{font-family:"Cinzel",serif;font-weight:700;font-size:14px;color:#ffcb2f;letter-spacing:3px}
.arm-links{display:flex;gap:4px;flex:1}
.arm-links a{font-family:"Cinzel",serif;font-size:12px;font-weight:600;color:#a99b78;text-decoration:none;letter-spacing:1px;padding:6px 12px;border-radius:4px;transition:color .2s,background .2s}
.arm-links a:hover{color:#ffcb2f;background:rgba(255,203,47,.06)}
.arm-links a.active{color:#ffcb2f;background:rgba(255,203,47,.1)}
.arm-site{font-family:"Jersey 15",monospace;font-size:14px;color:#a99b78;text-decoration:none;letter-spacing:1px;transition:color .2s}
.arm-site:hover{color:#c9a227}
@media(max-width:600px){.arm-nav{padding:10px 14px;gap:10px}.arm-brand span{font-size:12px;letter-spacing:2px}.arm-links{order:3;width:100%;justify-content:center}.arm-links a{font-size:11px;padding:5px 8px}.arm-site{font-size:13px}}
/* --- footer --- */
.ef-footer{padding:32px 20px 24px;text-align:center;border-top:1px solid #3a2e1a;margin-top:40px}
.ef-footer .foot-links{display:flex;gap:16px;justify-content:center;margin-bottom:12px}
.ef-footer .foot-links a{font-family:"Cinzel",serif;font-size:12px;color:#a99b78;text-decoration:none;letter-spacing:1px}
.ef-footer .foot-links a:hover{color:#c9a227}
.ef-footer .disclaimer{font-size:11px;color:#a99b78;opacity:.35;line-height:1.6;max-width:480px;margin:0 auto}
/* --- shared saves panel --- */
.shared-panel{margin-top:18px}
.shared-list{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;padding-right:4px}
.shared-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0f0c07;border:1px solid #3a2e1a;border-radius:9px;cursor:pointer;transition:border-color .15s}
.shared-item:hover{border-color:#7b663a}
.shared-item .si-icon{font-size:18px;flex:0 0 28px;text-align:center}
.shared-item .si-info{flex:1;min-width:0}
.shared-item .si-name{font-weight:700;color:#e6d9b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shared-item .si-meta{font-size:11px;color:#a99b78}
.shared-item .si-cat{font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(255,203,47,.1);color:#c9a227;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.shared-item .si-actions{display:flex;gap:6px}
.shared-empty{text-align:center;padding:24px;color:#a99b78;font-size:13px}
/* --- Timestamp Generator --- */
.ts-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:75;display:none;place-items:center;padding:16px}
.ts-overlay.open{display:grid}
.ts-panel{width:min(540px,100%);max-height:90vh;overflow:auto;background:#1e1809;border:1px solid #3a2e1a;border-radius:14px;box-shadow:0 20px 60px #000;padding:0}
.ts-header{display:flex;align-items:center;padding:15px 16px;border-bottom:1px solid #3a2e1a}
.ts-header h3{margin:0;font-family:'Cinzel',serif;font-size:15px;letter-spacing:.06em}
.ts-header .spacer{flex:1}
.ts-close{border:0;background:transparent;color:#a99b78;font-size:20px;padding:6px 8px;border-radius:8px;cursor:pointer}
.ts-close:hover{background:#261f0f;color:white}
.ts-body{padding:16px}
.ts-inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.ts-inputs .field.full{grid-column:1/-1}
.ts-table{width:100%;border-collapse:separate;border-spacing:0}
.ts-table th{text-align:left;font-size:11px;color:#a99b78;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid #3a2e1a}
.ts-table td{padding:8px 10px;border-bottom:1px solid rgba(58,46,26,.5);vertical-align:middle}
.ts-table tr:last-child td{border-bottom:0}
.ts-syntax{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#c9b88a;background:#0a0805;padding:4px 8px;border-radius:6px;border:1px solid #3a2e1a;display:inline-block;white-space:nowrap;user-select:all}
.ts-preview{color:#e6d9b8;font-size:13px}
.ts-preview .timestampChip{background:#3f4147;padding:1px 4px;border-radius:3px;color:#e3e5e8;display:inline-block}
.ts-copy{min-width:60px;padding:6px 10px;border:1px solid #3a2e1a;border-radius:8px;background:#1e1809;color:#e6d9b8;font-size:11px;font-weight:750;cursor:pointer;white-space:nowrap}
.ts-copy:hover{border-color:#8a7449;color:#ffcb2f}
.ts-copy.copied{border-color:#4ad04a;color:#4ad04a}
.ts-hint{font-size:12px;color:#a99b78;margin-top:12px;line-height:1.5}
@media(max-width:600px){.ts-inputs{grid-template-columns:1fr}.ts-table td,.ts-table th{padding:6px 8px;font-size:11px}.ts-syntax{font-size:11px}.ts-copy{min-height:44px}}
/* --- AI Assist --- */

.ai-overlay.open{display:grid}
.ai-panel{width:min(600px,100%);max-height:90vh;overflow:auto;background:#1e1809;border:1px solid #3a2e1a;border-radius:14px;box-shadow:0 20px 60px #000;padding:0}
.ai-header{display:flex;align-items:center;padding:15px 16px;border-bottom:1px solid #3a2e1a}
.ai-header h3{margin:0;font-family:'Cinzel',serif;font-size:15px;letter-spacing:.06em}
.ai-header .spacer{flex:1}
.ai-close{border:0;background:transparent;color:#a99b78;font-size:20px;padding:6px 8px;border-radius:8px;cursor:pointer}

<script>
const EF_VERSION='2.3';
const STORE_KEY='mm-eventforge-v3';
const EMOJIS=['🎉','⚔️','📅','🕘','⏳','🌎','📍','👑','🎒','📋','🏆','📸','🔥','💰','☠️','🛡️','🧠','🎯','💬','✅','❗','⚠️','🔴','🟢','🟡','🔵','🗡️','🏹','🍖','🧪','💀','👥','📢','🏃','⭐','🎁','🥇','🥈','🥉','📝','🧩','🔒','🔓','🔔','🕹️','🎲','🪙','💎','🛠️','🧙','🏰','🌲','🐉','🦀','🪦','🧭','📌','➡️','✨','🚨','❤️','💥','🪄','⛏️','🎣','🌟'];
const uid=()=>crypto.randomUUID();
const esc=s=>(s??'').toString().replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>structuredClone(o);
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pad2=n=>String(n).padStart(2,'0');
const toISO=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const fromISO=s=>{const[a,b,c]=(s||'').split('-').map(Number);return new Date(a,b-1,c)};
const addDaysISO=(s,n)=>{const d=fromISO(s);d.setDate(d.getDate()+n);return toISO(d)};
const daysBetweenISO=(a,b)=>Math.round((fromISO(b)-fromISO(a))/864e5);
function nextDowISO(dow,extraWeeks=0){const d=new Date();d.setDate(d.getDate()+(dow-d.getDay()+7)%7+extraWeeks*7);return toISO(d)}
function defaultRecurrence(){return{freq:'none',interval:2,days:[]}}
function eventDefaults(e){e.recurrence=e.recurrence||defaultRecurrence();if(!Array.isArray(e.recurrence.days))e.recurrence.days=[];if(!(e.recurrence.interval>=1))e.recurrence.interval=2;if(e.repeatNote===undefined)e.repeatNote=false;if(e.rsvp===undefined)e.rsvp=true;e.rsvpEmoji=e.rsvpEmoji||'✅';if(e.dinkNote===undefined)e.dinkNote=false;if(e.multiDay===undefined)e.multiDay=!!(e.endDate&&e.endDate!==e.date);return e}
function nextOccurrenceISO(dateISO,rec){if(!dateISO)return dateISO;const f=rec?.freq;if(f==='daily')return addDaysISO(dateISO,1);if(f==='weekly')return addDaysISO(dateISO,7);if(f==='biweekly')return addDaysISO(dateISO,14);if(f==='monthly'){const d=fromISO(dateISO),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return toISO(d)}if(f==='custom'){const iv=Math.max(1,rec.interval||1),days=[...(rec.days||[])].sort((a,b)=>a-b);if(!days.length)return addDaysISO(dateISO,7*iv);const cur=fromISO(dateISO).getDay();for(const day of days)if(day>cur)return addDaysISO(dateISO,day-cur);return addDaysISO(dateISO,7*iv-cur+days[0])}return dateISO}
function recurrenceSummary(rec,dateISO){const f=rec?.freq;if(!f||f==='none')return'';const wd=dateISO?DOW[fromISO(dateISO).getDay()]:'';if(f==='daily')return'Every day';if(f==='weekly')return wd?`Every ${wd}`:'Every week';if(f==='biweekly')return wd?`Every 2 weeks on ${wd}`:'Every 2 weeks';if(f==='monthly')return dateISO?`Monthly on the ${ordinal(fromISO(dateISO).getDate())}`:'Every month';const iv=Math.max(1,rec.interval||1),names=(rec.days||[]).slice().sort((a,b)=>a-b).map(d=>DOW[d].slice(0,3)).join(', ');return`Every ${iv===1?'week':iv+' weeks'}${names?` on ${names}`:''}`}
function durationText(e){if(!e.date)return'';if(e.endDate&&e.endDate!==e.date){const days=daysBetweenISO(e.date,e.endDate)+1;if(days<=0)return'⚠ Ends before it starts';if(days%7===0)return`${days/7} week${days>7?'s':''}`;return`${days} days`}if(e.endTime&&e.time){const s=zonedUnix(e.date,e.time,e.timezone),x=zonedUnix(e.endDate||e.date,e.endTime,e.timezone);if(s&&x){const h=(x-s)/3600;if(h<=0)return'⚠ Ends before it starts';return h<1?`${Math.round(h*60)} minutes`:`${+h.toFixed(1)} hour${h>=2?'s':''}`}}return''}
const masterDefaults=()=>({footer:'',importance:{details:'small',requirements:'featured',rules:'normal',prizes:'featured',gear:'normal',submissions:'normal',training:'featured',custom:'normal'},emoji:{details:'📍',requirements:'📋',rules:'⚔️',prizes:'🏆',gear:'🎒',submissions:'📸',training:'🧠',custom:'📝'}});
const blockFactory={
 details:()=>({id:uid(),kind:'details',label:'Event Details',emoji:'📍',importance:'small',visible:true,showLabel:false,open:false,world:'329',location:'Clan Hall',host:'',condition:'always'}),
 requirements:()=>({id:uid(),kind:'requirements',label:'Requirements',emoji:'📋',importance:'featured',visible:true,showLabel:true,open:false,items:[''],condition:'always'}),
 rules:()=>({id:uid(),kind:'rules',label:'Rules',emoji:'⚔️',importance:'normal',visible:true,showLabel:true,open:false,items:[''],condition:'always'}),
 prizes:()=>({id:uid(),kind:'prizes',label:'Prizes',emoji:'🏆',importance:'featured',visible:true,showLabel:true,open:false,items:['🥇 1st Place - '],condition:'always'}),
 gear:()=>({id:uid(),kind:'gear',label:'Gear / Supplies',emoji:'🎒',importance:'normal',visible:true,showLabel:true,open:false,value:'',provided:'',condition:'always'}),
 submissions:()=>({id:uid(),kind:'submissions',label:'Submissions',emoji:'📸',importance:'normal',visible:true,showLabel:true,open:false,value:'',condition:'always'}),
 training:()=>({id:uid(),kind:'training',label:'Training Session',emoji:'🧠',importance:'featured',visible:true,showLabel:true,open:false,name:'Training Session',date:'',time:'20:00',timezone:'America/New_York',world:'329',location:'Clan Hall',details:'',condition:'always'}),
 custom:()=>({id:uid(),kind:'custom',label:'Custom Section',emoji:'📝',importance:'normal',visible:true,showLabel:true,open:false,value:'',condition:'always'}),
 divider:()=>({id:uid(),kind:'divider',label:'Divider',visible:true,open:false,condition:'always'}),
 spacer:()=>({id:uid(),kind:'spacer',label:'Spacer',visible:true,open:false,condition:'always'})
};
const OSRS_SKILLS=[['Attack','⚔️'],['Strength','💪'],['Defence','🛡️'],['Ranged','🏹'],['Prayer','🙏'],['Magic','🧙'],['Runecraft','🌀'],['Hitpoints','❤️'],['Crafting','🛠️'],['Mining','⛏️'],['Smithing','⚒️'],['Fishing','🎣'],['Cooking','🍳'],['Firemaking','🔥'],['Woodcutting','🪓'],['Agility','🏃'],['Herblore','🧪'],['Thieving','🎭'],['Fletching','🪶'],['Slayer','💀'],['Farming','🌱'],['Construction','🏠'],['Hunter','🐾'],['Sailing','⛵'],['Combat Level','🗡️'],['Total Level','📊'],['Quest Points','📜']];
const REQ_CHIPS=[['Base 70s','📊 Base 70 stats'],['Base 80s','📊 Base 80 stats'],['Base 90s','📊 Base 90 stats'],['Combat 100+','🗡️ 100+ Combat'],['Quest Cape','📜 Quest Cape'],['Barrows Gloves','🧤 Barrows Gloves']];
const presets={
 'PK Trip':['details','rules','gear','training'], 'PvM Mass':['details','requirements','gear','rules'], 'Competition':['details','requirements','submissions','prizes','rules'], 'Hide & Seek':['details','rules','prizes'], 'Skilling':['details','requirements','prizes'], 'Training':['details','training','requirements'], 'Minigame':['details','rules','prizes'], 'Social':['details','rules'], 'Custom':['details','custom']
};
function freshEvent(){return eventDefaults({id:uid(),name:'',type:'Custom',preset:'Custom',date:nextDowISO(6),time:'20:00',endDate:'',endTime:'23:30',timezone:'America/New_York',tags:[],favorite:false,blocks:presets.Custom.map(k=>blockFactory[k]()),results:{summary:'',winners:[]},meta:{created:Date.now(),updated:Date.now()}})}
function defaultLineEmoji(){return{when:'📅',starts:'⏳',ends:'🏁',world:'🌎',meet:'📍',host:'👑',repeat:'🔁',rsvp:'✅',dink:'💬'}}
function defaultState(){return {route:'create',mobilePreview:false,event:freshEvent(),events:[],templates:[],customFields:[],mentions:[],settings:{clan:'',timezone:'America/New_York',defaultWorld:'329',defaultLocation:'Clan Hall',master:masterDefaults(),lineEmoji:defaultLineEmoji()},draftHistory:[],postType:'announcement',outputStyle:'classic',templateCategory:'All',autosaveAt:null,dirty:false,filter:'',tagFilter:'',charLimit:2000}}
function normalize(s){s.settings=s.settings||defaultState().settings;s.settings.master=Object.assign(masterDefaults(),s.settings.master||{});s.customFields=s.customFields||[];s.mentions=s.mentions||[];s.templates=s.templates||[];s.events=s.events||[];s.event=s.event||freshEvent();s.event.tags=s.event.tags||[];s.event.results=s.event.results||{summary:'',winners:[]};s.event.blocks=s.event.blocks||[];s.postType=s.postType||'announcement';eventDefaults(s.event);s.outputStyle=['classic','minimal','compact'].includes(s.outputStyle)?s.outputStyle:'classic';s.templateCategory=s.templateCategory||'All';s.settings.lineEmoji=Object.assign(defaultLineEmoji(),s.settings.lineEmoji||{});s.charLimit=[2000,4000].includes(s.charLimit)?s.charLimit:2000;return s}
function loadState(){try{const raw=localStorage.getItem(STORE_KEY);if(raw)return normalize(JSON.parse(raw))}catch{}return defaultState()}
let state=loadState();
function persist(){state.autosaveAt=Date.now();state.event.meta=state.event.meta||{};state.event.meta.updated=Date.now();localStorage.setItem(STORE_KEY,JSON.stringify(state));renderSaveStatus()}
function markDirty(version=false){state.dirty=true;if(version)pushDraftVersion();clearTimeout(window.__saveT);window.__saveT=setTimeout(persist,300)}
function pushDraftVersion(){const snap=clone(state.event);snap.__at=Date.now();state.draftHistory.unshift(snap);state.draftHistory=state.draftHistory.slice(0,10)}
function nav(){return ['create','events','templates','shared','settings'].map(r=>`<button data-route="${r}" class="${state.route===r?'active':''}">${{create:'Create',events:'Events',templates:'Templates',shared:'Shared',settings:'Settings'}[r]}</button>`).join('')+'<button id="tsNavBtn" title="Discord Timestamp Generator">🕐 Timestamp</button><button id="aiNavBtn" title="AI Event Assistant">🤖 AI Assist</button>'}
function navToggleLabel(){const labels={create:'Create',events:'Events',templates:'Templates',shared:'Shared',settings:'Settings'};return labels[state.route]||'Menu'}
function render(opts={}){eventDefaults(state.event);const restoreY=opts.restoreY;const navEl=document.getElementById('nav');navEl.innerHTML=nav();/* mobile nav toggle */let toggle=document.getElementById('navToggle');if(!toggle){toggle=document.createElement('button');toggle.id='navToggle';toggle.className='nav-toggle';navEl.parentNode.insertBefore(toggle,navEl)}const collapsed=window.innerWidth<=900&&(sessionStorage.getItem('ef-nav-collapsed')!=='0');toggle.className='nav-toggle'+(collapsed?'':' open');toggle.innerHTML=navToggleLabel()+' <span class="chevron">&#9662;</span>';navEl.classList.toggle('collapsed',collapsed);document.getElementById('app').classList.toggle('mobilePreviewMode',!!state.mobilePreview);const v=document.getElementById('view');v.innerHTML=state.route==='create'?createView():state.route==='events'?eventsView():state.route==='templates'?templatesView():state.route==='shared'?sharedView():settingsView();bind();if(state.route==='shared')fetchShared();renderSaveStatus();if(Number.isFinite(restoreY))requestAnimationFrame(()=>window.scrollTo(0,restoreY))}
function createView(){return `<div class="layout"><section class="builderPane">${builderCard()}${blocksCard()}</section><aside class="desktopPreview">${previewCard()}</aside></div>`}
function builderCard(){const ready=completeness(),e=state.event,rec=e.recurrence||defaultRecurrence(),multi=!!e.multiDay,recSum=recurrenceSummary(rec,e.date),dur=durationText(e);return `<div class="card"><div class="cardHead"><h2>Event Core</h2><span class="spacer"></span><span class="status" id="saveStatus">Autosave on</span></div><div class="body"><div class="readyRow"><strong>${ready.score}% Ready</strong><div class="meter" style="flex:1"><span style="width:${ready.score}%"></span></div></div>${ready.issues.length?`<div class="hint warning" style="margin:7px 0 12px">${ready.issues.slice(0,3).map(x=>'• '+esc(x)).join(' &nbsp; ')}</div>`:`<div class="hint" style="margin:7px 0 12px">Core event information looks complete.</div>`}<div class="grid"><div class="field full"><label>Event Name <span class="req">*</span></label><input id="eventName" value="${esc(e.name)}" placeholder="P2P PK Trip"></div><div class="field"><label>Event Preset</label><select id="preset">${Object.keys(presets).map(x=>`<option ${e.preset===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Timezone</label><select id="timezone">${tzOptions(e.timezone)}</select></div><div class="field full"><label>Event Length</label><div class="postType"><button class="mini ${!multi?'active':''}" id="singleDayBtn">Single day</button><button class="mini ${multi?'active':''}" id="multiDayBtn">Multi-day</button><span class="hint" id="durationHint" style="align-self:center">${esc(dur)}</span></div></div><div class="field"><label>Start Date <span class="hint">optional</span></label><input id="date" type="date" value="${e.date||''}"><div class="rowBtns" style="margin-top:6px">${[['today','Today'],['tomorrow','Tomorrow'],['thisSat','This Sat'],['nextSat','Next Sat'],['clear','✕ No date']].map(([k,l])=>`<button class="mini quickDate" data-q="${k}">${l}</button>`).join('')}</div></div><div class="field"><label>Start Time <span class="hint">optional</span></label><input id="time" type="time" value="${e.time||''}"></div>${multi?`<div class="field"><label>End Date</label><input id="endDate" type="date" value="${e.endDate||''}"></div>`:''}<div class="field"><label>End Time <span class="hint">optional</span></label><input id="endTime" type="time" value="${e.endTime||''}"></div><div class="field"><label>Repeat</label><select id="recFreq">${[['none','None'],['daily','Daily'],['weekly','Weekly'],['biweekly','Biweekly'],['monthly','Monthly'],['custom','Custom']].map(([k,l])=>`<option value="${k}" ${rec.freq===k?'selected':''}>${l}</option>`).join('')}</select><span class="hint" id="recSummary">${recSum?'🔁 '+esc(recSum):''}</span></div>${rec.freq==='custom'?`<div class="field"><label>Every N Weeks</label><input id="recInterval" type="number" min="1" max="12" value="${rec.interval||1}"></div><div class="field full"><label>On Days</label><div class="rowBtns">${DOW.map((d,i)=>`<button class="mini recDay ${rec.days.includes(i)?'on':''}" data-d="${i}">${d.slice(0,3)}</button>`).join('')}</div></div>`:''}${rec.freq!=='none'?`<div class="field full"><div class="switchline"><label class="switch"><input id="repeatNote" type="checkbox" ${e.repeatNote?'checked':''}><span class="slider"></span></label><span>Add repeat note to the post${recSum?` ("${esc(recSum)}")`:''}</span></div></div>`:''}<div class="field full"><label>Tags</label><input id="tags" value="${esc((e.tags||[]).join(', '))}" placeholder="PK, Wilderness, Weekend"><span class="hint">Comma-separated. Used for search/filtering.</span></div></div><div class="rowBtns" style="margin-top:12px">${rec.freq!=='none'?`<button class="btn gold" id="genNext" title="Clone this event and advance all dates by one interval">⏭ Generate Next</button>`:''}<button class="btn" id="applyMaster">🎨 Apply Master Style</button><button class="btn" id="draftHistoryBtn">🕘 Draft History (${state.draftHistory.length})</button><button class="btn ${e.favorite?'gold':''}" id="favEvent">${e.favorite?'★ Favorite':'☆ Favorite'}</button><button class="btn" id="clearForm">🧹 Clear Form</button></div></div></div>`}
function blocksCard(){const saved=state.customFields.length?state.customFields.map(f=>`<button class="btn addSavedField" data-id="${f.id}">${esc(f.emoji||'📝')} ${esc(f.name)}</button>`).join(''):'';return `<div class="card" style="margin-top:18px"><div class="cardHead"><h2>Announcement Structure</h2><span class="spacer"></span><button class="btn ghost" id="collapseAll">Collapse All</button></div><div class="body"><div class="hint" style="margin-bottom:10px">Drag blocks into any order. Every text field supports selection-based Discord formatting.</div><div class="sectionList" id="sectionList">${state.event.blocks.map(blockHtml).join('')}</div><div class="addBar">${[['requirements','📋 Requirements'],['rules','⚔️ Rules'],['prizes','🏆 Prizes'],['gear','🎒 Gear'],['submissions','📸 Submissions'],['training','🧠 Session'],['custom','➕ Custom'],['divider','— Divider'],['spacer','↕ Spacer']].map(([k,l])=>`<button class="btn addBlock" data-kind="${k}">${l}</button>`).join('')}</div>${saved?`<div class="divider"></div><div class="hint" style="margin-bottom:8px">Saved custom fields</div><div class="addBar">${saved}</div>`:''}</div></div>`}
function blockHtml(b){const simple=['divider','spacer'].includes(b.kind);return `<div class="block ${b.open?'open':''} ${!b.visible?'hiddenBlock':''}" draggable="true" data-id="${b.id}"><div class="blockTop"><span class="handle">≡</span>${!simple?`<button class="emojiBtn" data-emoji-id="${b.id}">${b.emoji||'＋'}</button>`:''}<div class="blockTitle"><strong>${esc(b.label||b.kind)}</strong><small>${b.kind} · ${b.importance||'normal'}${!b.visible?' · hidden':''}${b.condition&&b.condition!=='always'?' · conditional':''}</small></div><span class="hdrCtl"><span class="hdrTogs"><span class="hTog" title="Show block in the post"><i class="tIco">👁</i><label class="switch"><input type="checkbox" class="hVisible" ${b.visible?'checked':''}><span class="slider"></span></label></span>${!simple?`<span class="hTog" title="Show the label heading"><i class="tIco">🏷</i><label class="switch"><input type="checkbox" class="hShowLabel" ${b.showLabel?'checked':''}><span class="slider"></span></label></span>`:''}</span><button class="iconBtn moveUp">↑</button><button class="iconBtn moveDown">↓</button><button class="iconBtn hdrDel" title="Delete block">✕</button></span><button class="iconBtn toggleBlock">${b.open?'▾':'▸'}</button></div><div class="blockContent">${blockEditor(b)}</div></div>`}
function formatBar(targetId){return `<div class="toolbarHint">Highlight text, then tap a formatting button.</div><div class="formatBar" data-target="${targetId}"><button data-fmt="bold" title="Bold"><b>B</b></button><button data-fmt="italic" title="Italic"><i>I</i></button><button data-fmt="underline" title="Underline"><u>U</u></button><button data-fmt="strike" title="Strikethrough"><s>S</s></button><span class="sep"></span><button data-fmt="spoiler">Spoiler</button><button data-fmt="code">Code</button><button data-fmt="quote">❝</button><button data-fmt="bullet">• List</button><button data-fmt="number">1.</button><span class="sep"></span><button data-fmt="mention">@</button><button data-fmt="timestamp">🕐</button><button data-fmt="link">🔗</button><button data-fmt="undo">↶</button><button data-fmt="redo">↷</button></div>`}
function textArea(id,val,cls='bValue'){return `${formatBar(id)}<textarea id="${id}" class="${cls}" data-rich="1">${esc(val||'')}</textarea>`}
function blockEditor(b){const base=`<div class="grid"><div class="field"><label>Label</label><input class="bLabel" value="${esc(b.label||'')}"></div><div class="field"><label>Display</label><div class="switchline"><label class="switch"><input class="bVisible" type="checkbox" ${b.visible?'checked':''}><span class="slider"></span></label><span>Show block</span><label class="switch"><input class="bShowLabel" type="checkbox" ${b.showLabel?'checked':''}><span class="slider"></span></label><span>Show label</span></div></div><div class="field full"><label>Importance</label><div class="importance">${['small','normal','medium','featured'].map(x=>`<button class="${b.importance===x?'active':''}" data-importance="${x}">${{small:'Small',normal:'Normal',medium:'Large',featured:'Huge'}[x]}</button>`).join('')}</div></div><div class="field full"><label>Condition</label><select class="bCondition"><option value="always" ${b.condition==='always'?'selected':''}>Always show</option><option value="hasPrize" ${b.condition==='hasPrize'?'selected':''}>Only if a Prizes block has content</option><option value="hasEnd" ${b.condition==='hasEnd'?'selected':''}>Only if event has an end date/time</option><option value="competition" ${b.condition==='competition'?'selected':''}>Only for Competition preset</option><option value="pk" ${b.condition==='pk'?'selected':''}>Only for PK Trip preset</option></select></div></div>`;
 if(b.kind==='divider'||b.kind==='spacer')return `${base}<div class="rowBtns" style="margin-top:10px">${blockActions()}</div>`;
 let body='';
 if(b.kind==='details')body=`<div class="grid"><div class="field"><label>World</label><input class="dWorld" value="${esc(b.world||'')}"></div><div class="field"><label>Starting Location</label><input class="dLocation" value="${esc(b.location||'')}"></div><div class="field full"><label>Host / Leader</label><input class="dHost" value="${esc(b.host||'')}"></div></div>`;
 else if(['requirements','rules','prizes'].includes(b.kind))body=`${b.kind==='requirements'?`<div class="field"><label>Quick Add — Stat Requirement</label><div class="rowBtns"><select class="reqSkill" style="flex:1;min-width:150px;background:#0d0b08;color:var(--text);border:1px solid #3a2e1a;border-radius:9px;padding:9px 10px">${OSRS_SKILLS.map(([n,em])=>`<option value="${n}">${em} ${n}</option>`).join('')}</select><input class="reqLvl" type="number" min="1" max="2277" value="80" style="width:84px;background:#0d0b08;color:var(--text);border:1px solid #3a2e1a;border-radius:9px;padding:9px 10px"><button class="mini reqAdd">+ Add</button></div><div class="rowBtns" style="margin-top:6px">${REQ_CHIPS.map(([l],i)=>`<button class="mini reqChip" data-i="${i}">${l}</button>`).join('')}</div><span class="hint" style="margin-top:4px">Picks land as editable lines below — tweak the wording or swap the emoji any time.</span></div><div class="divider"></div>`:''}<div class="field"><label>Items</label>${b.items.map((x,j)=>`<div style="margin-bottom:8px">${formatBar(`li-${b.id}-${j}`)}<div style="display:flex;gap:6px;align-items:flex-start"><textarea id="li-${b.id}-${j}" class="listItem" data-j="${j}" data-rich="1" rows="1">${esc(x)}</textarea><button class="mini danger delItem" data-j="${j}">✕</button></div></div>`).join('')}<button class="mini addItem">+ Add Item</button></div>`;
 else if(b.kind==='training')body=`<div class="grid"><div class="field full"><label>Session Name</label><input class="sName" value="${esc(b.name||'')}"></div><div class="field"><label>Date</label><input class="sDate" type="date" value="${b.date||''}"></div><div class="field"><label>Time</label><input class="sTime" type="time" value="${b.time||''}"></div><div class="field"><label>World</label><input class="sWorld" value="${esc(b.world||'')}"></div><div class="field"><label>Location</label><input class="sLocation" value="${esc(b.location||'')}"></div><div class="field full"><label>Details</label>${textArea(`ta-${b.id}`,b.details,'sDetails')}</div></div>`;
 else if(b.kind==='gear')body=`<div class="grid"><div class="field"><label>Provided by clan?</label><select class="gProvided"><option value="" ${!b.provided?'selected':''}>Not specified</option><option ${b.provided==='Yes'?'selected':''}>Yes</option><option ${b.provided==='Partially'?'selected':''}>Partially</option><option ${b.provided==='No'?'selected':''}>No</option></select></div><div class="field full"><label>Gear / Supplies Text</label>${textArea(`ta-${b.id}`,b.value)}</div></div>`;
 else body=`<div class="field"><label>Content</label>${textArea(`ta-${b.id}`,b.value)}</div>`;
 return `${base}<div class="divider"></div>${body}<div class="rowBtns" style="margin-top:10px">${blockActions()}</div>`}
function blockActions(){return `<button class="mini dupBlock">Duplicate</button><button class="mini moveTop">Top</button><button class="mini moveBottom">Bottom</button><button class="mini saveField">Save as Field</button><button class="mini danger delBlock">Delete</button>`}
function previewCard(){const raw=generatePost(state.postType);const lim=state.charLimit;return `<div class="previewWrap"><div class="card"><div class="cardHead"><h2>Discord Preview</h2><span class="spacer"></span><button class="nitro-toggle${lim===4000?' active':''}" id="nitroToggle" title="Toggle between Standard (2K) and Nitro (4K) character limit">${lim===4000?'4K':'2K'}</button><span class="hint" id="charCount">${raw.length} chars${raw.length>lim?' ⚠️':''}</span></div><div class="body" style="padding-bottom:8px"><div class="postType">${[['announcement','Announcement'],['24h','24h Reminder'],['1h','1h Reminder'],['now','Starting Now'],['results','Results']].map(([k,l])=>`<button class="mini postTypeBtn ${state.postType===k?'active':''}" data-type="${k}">${l}</button>`).join('')}</div><div class="postType" style="margin-top:8px"><span class="hint" style="align-self:center">Style:</span>${[['classic','Classic'],['minimal','Minimal'],['compact','Compact']].map(([k,l])=>`<button class="mini styleBtn ${state.outputStyle===k?'active':''}" data-style="${k}">${l}</button>`).join('')}<button class="mini optBtn ${state.event.rsvp?'on':''}" data-opt="rsvp">${esc(state.settings.lineEmoji?.rsvp||'✅')} RSVP</button><button class="mini optBtn ${state.event.dinkNote?'on':''}" data-opt="dinkNote">💬 Dink note</button></div>${state.event.rsvp?`<div class="rowBtns" style="margin-top:8px"><span class="hint" style="align-self:center">RSVP react emoji:</span><input id="rsvpEmoji" value="${esc(state.event.rsvpEmoji||'✅')}" style="width:72px;background:#0d0b08;color:var(--text);border:1px solid #3a2e1a;border-radius:9px;padding:6px 8px"></div>`:''}</div><div class="discord"><div class="discordMsg">${state.postType==='announcement'&&state.outputStyle!=='compact'?editableDiscordPreview():renderDiscordPreview(raw)}</div></div><div class="body"><div class="rowBtns"><button class="btn gold" id="copyBtn">📋 Copy to Discord</button><button class="btn" id="saveEventBtn">💾 Save Event</button><button class="btn" id="saveTemplateBtn">🧩 Save as Template</button><button class="btn" id="copyJsonCurrent">📋 JSON</button>${state.postType==='results'?'<button class="btn" id="editResultsBtn">🏆 Edit Results</button>':''}</div><details style="margin-top:12px"><summary class="hint">Raw Discord Markdown</summary><div class="raw" style="margin-top:8px">${esc(raw)}</div></details></div></div></div>`}
function eventsView(){const items=filtered(state.events);return `<div class="card"><div class="cardHead"><h2>Saved Events</h2><span class="spacer"></span><button class="btn" id="exportBackupQuick">Export Backup</button></div><div class="body">${searchBar()}${items.length?`<div class="templateGrid">${items.map(tileEvent).join('')}</div>`:`<div class="hint">No matching saved events.</div>`}</div></div>`}
const TEMPLATE_CATS=['PvM','Skilling','Minigame','Social','Competition','Other'];
function templatesView(){const items=filtered(state.templates,true).filter(t=>state.templateCategory==='All'||(t.category||'Other')===state.templateCategory);return `<div class="card"><div class="cardHead"><h2>Templates</h2><span class="spacer"></span><button class="btn gold" id="importTemplateBtn">⬆ Import Template</button><button class="btn" id="applyMasterAll">Apply Master Style to All</button></div><div class="body"><div class="postType" style="margin-bottom:12px">${['All',...TEMPLATE_CATS].map(c=>`<button class="mini catBtn ${state.templateCategory===c?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div>${searchBar()}${items.length?`<div class="templateGrid">${items.map(tileTemplate).join('')}</div>`:`<div class="hint">No matching templates.</div>`}</div></div>`}
function searchBar(){return `<div class="searchbar"><input id="searchFilter" placeholder="Search name, preset, tags..." value="${esc(state.filter||'')}"><input id="tagFilter" placeholder="Filter by tag" value="${esc(state.tagFilter||'')}"></div>`}
function filtered(arr,isTemplate=false){const q=(state.filter||'').toLowerCase(),t=(state.tagFilter||'').toLowerCase();return arr.filter(x=>{const e=isTemplate?x.event:x;const name=(isTemplate?x.templateName:e.name)||'';const hay=[name,e.preset,(e.tags||[]).join(' ')].join(' ').toLowerCase();return (!q||hay.includes(q))&&(!t||(e.tags||[]).some(z=>z.toLowerCase().includes(t)))}).sort((a,b)=>((isTemplate?b.favorite:b.favorite)?1:0)-((isTemplate?a.favorite:a.favorite)?1:0))}
function tileEvent(e){return `<div class="tile"><button class="fav ${e.favorite?'on':''} favSaved" data-id="${e.id}">${e.favorite?'★':'☆'}</button><h3>${esc(e.name||'Untitled Event')}</h3><p>${esc(e.preset||'Custom')} · ${e.date||'No date'}${e.recurrence&&e.recurrence.freq!=='none'?' · 🔁 '+esc(recurrenceSummary(e.recurrence,e.date)):''}</p><div class="chips">${(e.tags||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="actions" style="margin-top:12px"><button class="mini loadEvent" data-id="${e.id}">Open</button><button class="mini dupEvent" data-id="${e.id}">Duplicate</button><button class="mini copySaved" data-id="${e.id}">Copy</button><button class="mini cloudShareEvent" data-id="${e.id}">☁️ Share</button><button class="mini historyEvent" data-id="${e.id}">History</button><button class="mini resultEvent" data-id="${e.id}">Results</button><button class="mini copyJsonEvent" data-id="${e.id}">JSON</button><button class="mini danger deleteEvent" data-id="${e.id}">Delete</button></div></div>`}
function tileTemplate(t){const locked=(t.fillIn||[]).length?`<span class="chip">✏️ Fill-in: ${(t.fillIn||[]).join(', ')}</span>`:'';return `<div class="tile"><button class="fav ${t.favorite?'on':''} favTemplate" data-id="${t.id}">${t.favorite?'★':'☆'}</button><h3>${esc(t.templateName)}</h3><p>${esc(t.category||'Other')} · ${esc(t.event.preset||'Custom')} · ${t.event.blocks.length} blocks ${t.inheritMaster?'· Master style':''}</p><div class="chips">${locked}${(t.event.tags||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="actions" style="margin-top:12px"><button class="mini useTemplate" data-id="${t.id}">Use</button><button class="mini previewTemplate" data-id="${t.id}">Preview</button><button class="mini shareTemplate" data-id="${t.id}">🔗 Link</button><button class="mini cloudShareTemplate" data-id="${t.id}">☁️ Share</button><button class="mini exportTemplate" data-id="${t.id}">⬇ Export</button><button class="mini applyMasterTemplate" data-id="${t.id}">Apply Master</button><button class="mini copyJsonTemplate" data-id="${t.id}">JSON</button><button class="mini danger deleteTemplate" data-id="${t.id}">Delete</button></div></div>`}
function settingsView(){return `<div class="card"><div class="cardHead"><h2>Settings & Toolbox</h2></div><div class="body"><h3 style="margin-top:0">Clan Defaults</h3><div class="grid"><div class="field"><label>Clan Name</label><input id="sClan" value="${esc(state.settings.clan)}"></div><div class="field"><label>Default Timezone</label><select id="sTZ">${tzOptions(state.settings.timezone)}</select></div><div class="field"><label>Default World</label><input id="sWorld" value="${esc(state.settings.defaultWorld)}"></div><div class="field"><label>Default Meeting Location</label><input id="sLoc" value="${esc(state.settings.defaultLocation)}"></div></div><div class="divider"></div><h3>Master Template Style</h3><div class="grid"><div class="field full"><label>Global Footer <span class="hint">optional; appended to announcements</span></label>${textArea('masterFooter',state.settings.master.footer,'masterFooter')}</div></div><div class="hint" style="margin-top:8px">Master Style lets templates inherit your default block emojis and importance. Applying it never changes the actual event text.</div><div class="rowBtns" style="margin-top:10px"><button class="btn" id="editMasterStyle">Edit Master Block Defaults</button></div><div class="divider"></div><h3>Output Line Emoji</h3><div class="hint" style="margin-bottom:8px">Swap the emoji used on the core lines of every post (e.g. replace the flag on Ends with a clock). Leave one blank to remove it. The Minimal output style ignores these.</div><div class="grid">${[['when','When'],['starts','Starts'],['ends','Ends'],['world','World'],['meet','Meet'],['host','Host'],['repeat','Repeat note'],['rsvp','RSVP line'],['dink','Dink note']].map(([k,l])=>`<div class="field"><label>${l}</label><input class="lineEmojiInput" data-k="${k}" value="${esc(state.settings.lineEmoji[k]||'')}"></div>`).join('')}</div><div class="divider"></div><h3>Saved Discord Mentions</h3><div class="toolboxList">${state.mentions.map(m=>`<div class="smallCard"><strong>${esc(m.name)}</strong><div class="hint">${esc(m.code)}</div><div class="rowBtns" style="margin-top:8px"><button class="mini danger delMention" data-id="${m.id}">Delete</button></div></div>`).join('')||'<div class="hint">No mentions saved yet.</div>'}</div><button class="btn" id="addMention" style="margin-top:10px">+ Add Mention</button><div class="divider"></div><h3>Reusable Custom Fields</h3><div class="toolboxList">${state.customFields.map(f=>`<div class="smallCard"><strong>${esc(f.emoji||'📝')} ${esc(f.name)}</strong><div class="hint">${esc(f.defaultValue||'No default text')}</div><div class="rowBtns" style="margin-top:8px"><button class="mini danger delCustomField" data-id="${f.id}">Delete</button></div></div>`).join('')||'<div class="hint">No custom fields saved yet. Save any block as a reusable field from Create.</div>'}</div><button class="btn" id="addCustomField" style="margin-top:10px">+ Add Custom Field</button><div class="divider"></div><h3>Backup & Restore</h3><div class="rowBtns"><button class="btn gold" id="exportBackup">⬇ Export Full Backup</button><button class="btn" id="importBackup">⬆ Import Backup</button><button class="btn" id="copyBackup">📋 Copy Backup</button><button class="btn" id="pasteBackup">📥 Paste Backup</button></div><div class="hint" style="margin-top:8px">Backup includes saved events, templates, custom fields, mentions, settings, versions, and the current draft. On a phone, the clipboard route is easiest: <strong>Copy Backup</strong> here, send the text to yourself (notes app, Discord DM), then <strong>Paste Backup</strong> on the other device — no files involved.</div><div class="divider"></div><div class="rowBtns"><button class="btn gold" id="saveSettings">Save Settings</button><button class="btn danger" id="wipeData">Reset App Data</button></div></div></div>`}
function tzOptions(sel){return ['America/New_York','America/Chicago','America/Denver','America/Los_Angeles','UTC','Europe/London','Europe/Berlin','Australia/Sydney'].map(x=>`<option ${sel===x?'selected':''}>${x}</option>`).join('')}
function completeness(){let score=0,issues=[];const checks=[[!!state.event.name,25,'Add an event name'],[!!state.event.date,20,'Choose a date'],[!!state.event.time,15,'Choose a time'],[state.event.blocks.some(b=>b.kind==='details'&&b.world),15,'Add a world'],[state.event.blocks.some(b=>b.kind==='details'&&b.location),15,'Add a starting location'],[state.event.blocks.some(b=>hasContent(b)),10,'Add at least one announcement section']];checks.forEach(([ok,pts,msg])=>ok?score+=pts:issues.push(msg));return{score,issues}}
function hasContent(b){if(!b.visible)return false;if(b.items)return b.items.some(x=>x.trim());if(b.kind==='details')return !!(b.world||b.location||b.host);if(b.kind==='training')return !!(b.date||b.details);return !!(b.value||b.provided)}
function conditionOK(b){if(!b.visible)return false;if(!b.condition||b.condition==='always')return true;if(b.condition==='hasPrize')return state.event.blocks.some(x=>x.kind==='prizes'&&hasContent(x));if(b.condition==='hasEnd')return !!(state.event.endDate||state.event.endTime);if(b.condition==='competition')return state.event.preset==='Competition';if(b.condition==='pk')return state.event.preset==='PK Trip';return true}
function lem(k){if(state.outputStyle==='minimal')return'';const v=(state.settings.lineEmoji||defaultLineEmoji())[k];return v?v+' ':''}
function importancePrefix(b){if(!b.showLabel)return'';const emo=state.outputStyle==='minimal'?'':(b.emoji||'');const title=`${emo} ${b.label||''}`.trim();if(b.importance==='featured')return `# ${title}`;if(b.importance==='medium')return `## ${title}`;if(b.importance==='small')return `${emo} **${b.label}:**`.trim();return `### ${title}`}
function zonedUnix(date,time,tz){if(!date||!time)return null;const [Y,M,D]=date.split('-').map(Number),[h,m]=time.split(':').map(Number);let guess=Date.UTC(Y,M-1,D,h,m,0);for(let k=0;k<3;k++){const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(guess));const get=t=>+parts.find(p=>p.type===t).value;const asUTC=Date.UTC(get('year'),get('month')-1,get('day'),get('hour'),get('minute'));guess+=Date.UTC(Y,M-1,D,h,m)-asUTC}return Math.floor(guess/1000)}
function mainTimestamp(style='F'){const u=zonedUnix(state.event.date,state.event.time,state.event.timezone);return u?`<t:${u}:${style}>`:''}
function blockToText(b){if(!conditionOK(b))return'';if(b.kind==='spacer')return '\n';if(b.kind==='divider')return'────────────';const head=importancePrefix(b);let content='';if(b.kind==='details'){const lines=[];if(b.world)lines.push(`${lem('world')}**World:** ${b.world}`);if(b.location)lines.push(`${lem('meet')}**Meet:** ${b.location}`);if(b.host)lines.push(`${lem('host')}**Host:** ${b.host}`);content=lines.join('\n')}else if(['requirements','rules','prizes'].includes(b.kind)){content=(b.items||[]).filter(x=>x.trim()).map(x=>x.trim().match(/^(\d+[.)]|[-•*])/)?x:`• ${x}`).join('\n')}else if(b.kind==='gear'){const lines=[];if(b.provided)lines.push(`**Provided by clan:** ${b.provided}`);if(b.value)lines.push(b.value);content=lines.join('\n')}else if(b.kind==='training'){const lines=[];if(b.name&&b.name!==b.label)lines.push(`**${b.name}**`);const u=zonedUnix(b.date,b.time,b.timezone||state.event.timezone);if(u)lines.push(`${lem('when')}<t:${u}:F>\n${lem('starts')}<t:${u}:R>`);if(b.world)lines.push(`${lem('world')}**World:** ${b.world}`);if(b.location)lines.push(`${lem('meet')}**Meet:** ${b.location}`);if(b.details)lines.push(b.details);content=lines.join('\n')}else content=b.value||'';if(!head)return content;if(b.importance==='small'&&content&&!content.includes('\n'))return `${head} ${content}`;return [head,content].filter(Boolean).join('\n')}
function announcementPost(){if(state.outputStyle==='compact')return compactPost();const e=state.event,arr=[];if(e.name)arr.push(`# ${e.name}`);const su=zonedUnix(e.date,e.time,e.timezone),multi=e.endDate&&e.endDate!==e.date,eu=(e.endDate||e.endTime)?zonedUnix(e.endDate||e.date,e.endTime||e.time,e.timezone):null;if(su){if(multi&&eu)arr.push(`${lem('when')}**When:** <t:${su}:D> — <t:${eu}:D>\n${lem('starts')}**Starts:** <t:${su}:F> (<t:${su}:R>)`);else arr.push(`${lem('when')}**When:** <t:${su}:F>\n${lem('starts')}**Starts:** <t:${su}:R>`)}if(eu)arr.push(`${lem('ends')}**Ends:** <t:${eu}:F>`);e.blocks.forEach(b=>{const t=blockToText(b);if(t)arr.push(t)});const extras=extraLines();if(extras)arr.push(extras);if(state.settings.master.footer)arr.push(state.settings.master.footer);return arr.join('\n\n').trim()}
function extraLines(){const e=state.event,out=[];if(e.repeatNote&&e.recurrence?.freq!=='none'){const s=recurrenceSummary(e.recurrence,e.date);if(s)out.push(`${lem('repeat')}*Repeats: ${s}*`)}if(e.rsvp)out.push(`${lem('rsvp')}**React with ${e.rsvpEmoji||'✅'} if you plan to make it!**`);if(e.dinkNote)out.push(`${lem('dink')}*Running **Dink**? Keep it on so your drops and highlights post straight to Discord.*`);return out.join('\n')}
function compactPost(){const e=state.event,d=e.blocks.find(b=>b.kind==='details'&&b.visible),su=zonedUnix(e.date,e.time,e.timezone),parts=[`**${e.name||'Event'}**`];if(su)parts.push(`<t:${su}:f>`);if(e.endDate&&e.endDate!==e.date){const eu=zonedUnix(e.endDate,e.endTime||e.time,e.timezone);if(eu)parts.push(`ends <t:${eu}:d>`)}if(d?.world)parts.push(`${lem('world')}W${d.world}`);if(d?.location)parts.push(`${lem('meet')}${d.location}`);let out=parts.join(' • ');if(e.repeatNote&&e.recurrence?.freq!=='none'){const s=recurrenceSummary(e.recurrence,e.date);if(s)out+=` • ${lem('repeat')}${s}`}if(e.rsvp)out+=`\n${lem('rsvp')}React ${e.rsvpEmoji||'✅'} if you're in!`;return out}

function tsRefreshRows(){
  const d=document.getElementById('tsDate').value;
  const t=document.getElementById('tsTime').value;
  const tz=document.getElementById('tsTz').value;
  const u=zonedUnix(d,t,tz);
  const tbody=document.getElementById('tsRows');
  if(!u){tbody.innerHTML='<tr><td colspan="4" style="color:#a99b78;text-align:center;padding:20px">Pick a date and time to generate timestamps.</td></tr>';return}
  const formats=[
    ['t','Short Time'],['T','Long Time'],
    ['d','Short Date'],['D','Long Date'],
    ['f','Short Date/Time'],['F','Long Date/Time'],
    ['R','Relative']
  ];
  const dt=new Date(u*1000);
  tbody.innerHTML=formats.map(([code,label])=>{
    const syntax=`<t:${u}:${code}>`;
    const preview=tsFormatPreview(dt,code);
    return `<tr><td style="color:#a99b78;font-size:12px;white-space:nowrap">${esc(label)}</td>`+
      `<td><span class="ts-syntax">${esc(syntax)}</span></td>`+
      `<td class="ts-preview"><span class="timestampChip">${esc(preview)}</span></td>`+
      `<td><button class="ts-copy" data-syntax="${esc(syntax)}">Copy</button></td></tr>`;
  }).join('');
  tbody.querySelectorAll('.ts-copy').forEach(btn=>{
    btn.onclick=async()=>{
      const text=btn.dataset.syntax;
      try{await navigator.clipboard.writeText(text)}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
      btn.textContent='Copied!';btn.classList.add('copied');
      setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied')},1200);
      toast('Copied '+text);
    };
  });
}
function tsFormatPreview(dt,code){
  const o={timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone};
  try{
    if(code==='t')return dt.toLocaleTimeString('en-US',{...o,hour:'numeric',minute:'2-digit'});
    if(code==='T')return dt.toLocaleTimeString('en-US',{...o,hour:'numeric',minute:'2-digit',second:'2-digit'});
    if(code==='d')return dt.toLocaleDateString('en-US',{...o,month:'2-digit',day:'2-digit',year:'numeric'});
    if(code==='D')return dt.toLocaleDateString('en-US',{...o,month:'long',day:'numeric',year:'numeric'});
    if(code==='f')return dt.toLocaleDateString('en-US',{...o,month:'long',day:'numeric',year:'numeric'})+' '+dt.toLocaleTimeString('en-US',{...o,hour:'numeric',minute:'2-digit'});
    if(code==='F')return dt.toLocaleDateString('en-US',{...o,weekday:'long',month:'long',day:'numeric',year:'numeric'})+' '+dt.toLocaleTimeString('en-US',{...o,hour:'numeric',minute:'2-digit'});
    if(code==='R'){
      const diff=Math.floor((dt.getTime()-Date.now())/1000);
      const abs=Math.abs(diff);
      const suffix=diff>=0?'from now':'ago';
      if(abs<60)return abs+' second'+(abs!==1?'s':'')+' '+suffix;
      const mins=Math.floor(abs/60);
      if(mins<60)return mins+' minute'+(mins!==1?'s':'')+' '+suffix;
      const hrs=Math.floor(abs/3600);
      if(hrs<24)return hrs+' hour'+(hrs!==1?'s':'')+' '+suffix;
      const days=Math.floor(abs/86400);
      return days+' day'+(days!==1?'s':'')+' '+suffix;
    }
  }catch(e){}
  return '...';
}

function buildAiPrompt(idea){
const tz=state.settings.timezone||'America/New_York';
const w=state.settings.defaultWorld||'329';
const loc=state.settings.defaultLocation||'Clan Hall';
const ideaLine=idea ? `\nEVENT IDEA: ${idea}\n` : '\nNo specific idea provided. Create a fun, general-purpose clan event.\n';
return `You are an event planner for an OSRS (Old School RuneScape) clan called Multi-Misfits. I need you to create an EventForge event JSON.
${ideaLine}
CRITICAL RULES:
- Return ONLY valid JSON. No explanation, no markdown code fences, no text before or after.
- NEVER use em dashes anywhere in the output. Use hyphens (-) instead.
- The ONLY emoji allowed in text content are: ⚔️ (crossed swords) and ✅ (green checkmark).
- Do NOT use any other emoji in text fields (titles, rules, requirements, custom blocks, etc.).
- Medal emoji (🥇🥈🥉) are the ONLY exception, allowed exclusively in prize item lines.
- EVERY event MUST end with this RSVP line as the very last thing a reader sees. Add a custom block at the end of the blocks array with this exact text:
  "✅ React with ✅ if you plan to make it!"
- Always set "rsvp": true and "rsvpEmoji": "✅" in the event.

FORMATTING RULES:
- The JSON must match the EventForge template format exactly.
- Use the wrapped format: { "app": "eventforge-template", "v": 1, "template": { ... } }
- Pick the best preset for the event type.
- Fill in all relevant blocks with real content. Remove blocks that don't apply.
- Use Discord markdown in text fields (bold with **text**, bullet lists with - item).
- Dates should be ISO format (YYYY-MM-DD). Times should be 24h format (HH:MM).
- Default timezone: ${tz}
- Default world: ${w}
- Default meeting location: ${loc}
- Weekend events typically run Friday 16:00 to Sunday 22:00.
- Single day events typically run 20:00 to 23:30.
- Tags should be lowercase (e.g. pvm, wilderness, weekend, teams).
- Every block needs a unique "id" field (e.g. "b1", "b2", etc.).
- Keep the tone fun and engaging but clear.

TEMPLATE FORMAT:
{
  "app": "eventforge-template",
  "v": 1,
  "template": {
    "templateName": "Name of the template",
    "category": "PvM" | "Skilling" | "Minigame" | "Social" | "Competition" | "Other",
    "fillIn": [],
    "inheritMaster": false,
    "event": {
      "id": "unique-id",
      "name": "Event Name",
      "type": "preset value",
      "preset": "PK Trip" | "PvM Mass" | "Competition" | "Hide & Seek" | "Skilling" | "Training" | "Minigame" | "Social" | "Custom",
      "date": "YYYY-MM-DD or empty string",
      "time": "HH:MM or empty string",
      "endDate": "YYYY-MM-DD or empty string",
      "endTime": "HH:MM or empty string",
      "timezone": "${tz}",
      "tags": ["tag1", "tag2"],
      "favorite": false,
      "multiDay": false,
      "rsvp": true,
      "rsvpEmoji": "✅",
      "dinkNote": false,
      "repeatNote": false,
      "recurrence": { "freq": "none", "interval": 1, "days": [] },
      "blocks": [
        {
          "id": "b1",
          "kind": "details",
          "label": "Event Details",
          "emoji": "⚔️",
          "importance": "small",
          "visible": true,
          "showLabel": false,
          "open": false,
          "world": "${w}",
          "location": "${loc}",
          "host": "",
          "condition": "always"
        }
      ],
      "results": { "summary": "", "winners": [] },
      "meta": { "created": 0, "updated": 0 }
    }
  }
}

AVAILABLE BLOCK TYPES (include only the ones relevant to the event):

1. details - World, location, host info
   Fields: world (string), location (string), host (string)

2. requirements - List of requirements to participate
   Fields: items (string array, each item is one requirement line)

3. rules - List of rules
   Fields: items (string array)

4. prizes - Prize list
   Fields: items (string array)
   Example items: ["🥇 1st Place - 5M GP", "🥈 2nd Place - 2M GP"]

5. gear - Gear/supply requirements
   Fields: value (string, Discord markdown), provided ("" or "Yes" or "Partially" or "No")

6. submissions - How to submit results/screenshots
   Fields: value (string, Discord markdown)

7. training - A training/practice session with its own date/time
   Fields: name (string), date (YYYY-MM-DD), time (HH:MM), timezone (string), world (string), location (string), details (string)

8. custom - Free text section
   Fields: value (string, Discord markdown)

9. divider - Visual separator line (no extra fields needed)

10. spacer - Blank line (no extra fields needed)

Common block fields (all blocks have these):
- id: unique string
- kind: block type name from above
- label: display name (e.g. "Rules", "Prizes")
- emoji: single emoji for the section header (use ⚔️ or ✅ only)
- importance: "small" | "normal" | "medium" | "featured"
- visible: true (set false to hide a block)
- showLabel: true (set false to hide the section heading)
- open: false
- condition: "always"

REMEMBER: Return ONLY the JSON object. No text, no explanation, no code fences.`
}
function extractJson(raw){
let t=raw.trim().replace(/[“”„‟″‶]/g,'"').replace(/[‘’‚‛′‵]/g,"'");
const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/);
if(fence)t=fence[1].trim();
try{return{ok:true,data:JSON.parse(t)}}catch{}
const first=t.indexOf('{');
const last=t.lastIndexOf('}');
if(first!==-1&&last>first){
try{return{ok:true,data:JSON.parse(t.slice(first,last+1))}}catch(e){return{ok:false,err:e.message}}}
return{ok:false,err:'No JSON object found in text'};
}
function importAiResult(raw){
try{
const result=extractJson(raw);
if(!result.ok){toast(result.err.length>60?result.err.slice(0,60)+'...':result.err);return}
const parsed=result.data;
let event=null;
if(parsed.app==='eventforge-template'&&parsed.template&&parsed.template.event){
event=parsed.template.event;
}else if(parsed.event&&Array.isArray(parsed.event.blocks)){
event=parsed.event;
}else if(parsed.blocks&&Array.isArray(parsed.blocks)){
event=parsed;
}
if(!event||!Array.isArray(event.blocks)){toast('Could not find a valid event in the JSON');return}
event.id=uid();
event.meta={created:Date.now(),updated:Date.now()};
event.blocks.forEach(b=>{b.id=uid()});
state.event=eventDefaults(event);
state.route='create';
state.mobilePreview=false;
markDirty(true);
closeAiAssist();
render();
toast('Event imported from AI')
}catch(e){toast('Import error: '+(e.message||'unknown'))}
}

async function fetchSharedList(force){
  if(_sharedCache&&!force)return _sharedCache;
  _sharedLoading=true;
  try{
    const r=await fetch('/api/eventforge');
    if(!r.ok)throw new Error('API error');
    const d=await r.json();
    _sharedCache=d.saves||[];
    return _sharedCache;
  }catch(e){toast('Could not load shared saves');return _sharedCache||[]}
  finally{_sharedLoading=false}
}
async function fetchSharedItem(id){
  const r=await fetch('/api/eventforge?id='+encodeURIComponent(id));
  if(!r.ok)throw new Error('Not found');
  return r.json();
}
async function saveToCloud(type,name,category,data){
  const user=ensureSharedUser();if(!user)return null;
  const access_code=ensureAccessCode();if(!access_code)return null;
  const r=await fetch('/api/eventforge',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type,name,category,data,user,access_code})});
  if(r.status===401){clearAccessCode();toast('Wrong access code');return null}
  if(!r.ok){const e=await r.json().catch(()=>({}));toast(e.error||'Save failed');return null}
  _sharedCache=null;
  return r.json();
}
async function updateInCloud(id,version,updates){
  const user=ensureSharedUser();if(!user)return null;
  const access_code=ensureAccessCode();if(!access_code)return null;
  const body={id,version,user,access_code,...updates};
  const r=await fetch('/api/eventforge',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  if(r.status===401){clearAccessCode();toast('Wrong access code');return null}
  if(r.status===409){
    const conflict=await r.json();
    const overwrite=confirm(`This save was updated by ${conflict.updatedBy} at ${new Date(conflict.updatedAt).toLocaleString()}.\n\nDo you want to overwrite their changes?`);
    if(overwrite){
      body.version=conflict.currentVersion;
      const r2=await fetch('/api/eventforge',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
      if(r2.status===401){clearAccessCode();toast('Wrong access code');return null}
      if(!r2.ok){toast('Overwrite failed');return null}
      _sharedCache=null;return r2.json();
    }
    return null;
  }
  if(!r.ok){const e=await r.json().catch(()=>({}));toast(e.error||'Update failed');return null}
  _sharedCache=null;return r.json();
}
async function deleteFromCloud(id){
  const access_code=ensureAccessCode();if(!access_code)return false;
  const r=await fetch('/api/eventforge',{method:'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify({id,access_code})});
  if(r.status===401){clearAccessCode();toast('Wrong access code');return false}
  if(!r.ok){toast('Delete failed');return false}
  _sharedCache=null;return true;
}

function timeAgo(iso){
  if(!iso)return '';
  const d=Date.now()-new Date(iso).getTime();
  if(d<60000)return 'just now';
  if(d<3600000)return Math.floor(d/60000)+'m ago';
  if(d<86400000)return Math.floor(d/3600000)+'h ago';
  return Math.floor(d/86400000)+'d ago';
}

<script>
/* ============================================================
   EventForge QoL enhancement layer (additive — no app logic changed)
   1) Text selection inside draggable blocks
   2) Spellcheck + autocapitalize + autocorrect (spelling / caps / word suggestions)
   3) Auto-growing textareas
   4) Discord 2000-char limit meter
   5) Keyboard shortcuts: Ctrl/Cmd+S = Save Event, Ctrl/Cmd+Enter = Copy to Discord
   ============================================================ */
(function(){
  var app=document.getElementById('app'); if(!app) return;
  var FIELD='input,textarea,select';

  /* 1) A block is draggable="true"; pressing a field inside it starts a drag
        instead of selecting text. Disable the block's drag the moment a field
        is pressed, restore it on release — so highlighting works, reorder still does too. */
  document.addEventListener('pointerdown',function(e){
    var f=e.target.closest(FIELD); if(!f) return;
    var bl=f.closest('.block'); if(bl){ bl.setAttribute('data-nodrag','1'); bl.setAttribute('draggable','false'); }
  },true);
  function restoreDrag(){ document.querySelectorAll('.block[data-nodrag]').forEach(function(bl){ bl.removeAttribute('data-nodrag'); bl.setAttribute('draggable','true'); }); }
  document.addEventListener('pointerup',restoreDrag,true);
  document.addEventListener('pointercancel',restoreDrag,true);
  /* never let a drag start from within a field (belt & suspenders) */
  document.addEventListener('dragstart',function(e){ if(e.target.closest(FIELD)||e.target.closest('a,label')) e.preventDefault(); },true);

  /* 2/3) enhance fields after every render */
  function isTexty(el){
    if(el.tagName==='TEXTAREA') return true;
    var t=(el.getAttribute('type')||'text').toLowerCase();
    return el.tagName==='INPUT' && (t==='text'||t==='search'||t==='');
  }
  function enhance(){
    app.querySelectorAll('textarea, input').forEach(function(el){
      if(isTexty(el)){
        el.setAttribute('spellcheck','true');
        el.setAttribute('autocorrect','on');
        var idc=(el.id+' '+el.className).toLowerCase();
        if(el.id==='eventName') el.setAttribute('autocapitalize','characters');            /* event name -> ALL CAPS keyboard */
        else if(!/world|url|link|code|time|date|number|host|leader/.test(idc)) el.setAttribute('autocapitalize','sentences');
        if(!el.getAttribute('autocomplete')) el.setAttribute('autocomplete','on');
      }
      if(el.tagName==='TEXTAREA' && !el.dataset.grow){
        el.dataset.grow='1';
        var grow=function(){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; };  /* grow to fit, uncapped */
        el.addEventListener('input',grow);
        requestAnimationFrame(grow);
      }
    });
    /* 4) Discord char limit meter (respects Nitro toggle) */
    var cc=document.getElementById('charCount');
    if(cc){
      var lim=(typeof state!=='undefined'&&state.charLimit)?state.charLimit:2000;
      var mm=(cc.textContent||'').match(/\d[\d,]*/);            /* first number only — never re-parse our own "/ N" suffix */
      var n=mm?parseInt(mm[0].replace(/,/g,''),10):0;
      var want=n.toLocaleString()+' / '+lim;
      if(cc.textContent!==want) cc.textContent=want;
      cc.classList.toggle('over',n>lim);
      cc.classList.toggle('warn',n>=Math.floor(lim*0.8)&&n<=lim);
    }
  }

  /* run enhance on load + on every re-render, without self-triggering the observer */
  var pending=false, cfg={childList:true,subtree:true};
  var obs=new MutationObserver(function(){
    if(pending) return; pending=true;
    requestAnimationFrame(function(){ pending=false; obs.disconnect(); try{enhance();}catch(_){}; obs.observe(app,cfg); });
  });
  try{ enhance(); }catch(_){}
  obs.observe(app,cfg);

  /* 5) keyboard shortcuts (don't clash with the app's Ctrl+B/I/U inside fields) */
  document.addEventListener('keydown',function(e){
    if(!(e.ctrlKey||e.metaKey)) return;
    var k=(e.key||'').toLowerCase();
    if(k==='s'){ e.preventDefault(); var b=document.getElementById('saveEventBtn'); if(b) b.click(); }
    else if(k==='enter'){ e.preventDefault(); var c=document.getElementById('copyBtn')||document.getElementById('bottomCopy'); if(c) c.click(); }
  });

  /* 6) Preview inline editing — click-to-edit in the Discord preview, changes save back to state + form */
  document.addEventListener('keydown',function(e){
    var pe=e.target.closest&&e.target.closest('.pedit');if(!pe)return;
    if(e.key==='Enter'&&!pe.classList.contains('pedit-ml')){e.preventDefault();pe.blur()}
    if(e.key==='Escape')pe.blur();
  },true);
  document.addEventListener('paste',function(e){
    var pe=e.target.closest&&e.target.closest('.pedit');if(!pe)return;
    e.preventDefault();
    var text=(e.clipboardData||window.clipboardData).getData('text/plain');
    document.execCommand('insertText',false,text);
  },true);
  document.addEventListener('focusout',function(e){
    var pe=e.target.closest&&e.target.closest('.pedit');
    if(!pe||!pe.closest('.discordMsg'))return;
    var field=pe.dataset.field,bid=pe.dataset.bid,idx=pe.dataset.idx,val=pe.innerText||'';
    if(field==='eventName'){state.event.name=val;var el=document.getElementById('eventName');if(el)el.value=val}

    markDirty();
    var raw=generatePost(),r=document.querySelector('.raw'),cc=document.getElementById('charCount');
    if(r)r.textContent=raw;
    if(cc){var len=raw.length;var lim2=(typeof state!=='undefined'&&state.charLimit)?state.charLimit:2000;cc.textContent=len+' chars'+(len>lim2?' ⚠️':'');cc.classList.toggle('over',len>lim2);cc.classList.toggle('warn',len>=Math.floor(lim2*0.8)&&len<=lim2)}
  },true);
})();
