function eventDefaults(e){e.recurrence=e.recurrence||defaultRecurrence();if(!Array.isArray(e.recurrence.days))e.recurrence.days=[];if(!(e.recurrence.interval>=1))e.recurrence.interval=2;if(e.repeatNote===undefined)e.repeatNote=false;if(e.rsvp===undefined)e.rsvp=false;e.rsvpEmoji=e.rsvpEmoji||'✅';if(e.dinkNote===undefined)e.dinkNote=false;if(e.multiDay===undefined)e.multiDay=!!(e.endDate&&e.endDate!==e.date);return e}
function nextOccurrenceISO(dateISO,rec){if(!dateISO)return dateISO;const f=rec?.freq;if(f==='daily')return addDaysISO(dateISO,1);if(f==='weekly')return addDaysISO(dateISO,7);if(f==='biweekly')return addDaysISO(dateISO,14);if(f==='monthly'){const d=fromISO(dateISO),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return toISO(d)}if(f==='custom'){const iv=Math.max(1,rec.interval||1),days=[...(rec.days||[])].sort((a,b)=>a-b);if(!days.length)return addDaysISO(dateISO,7*iv);const cur=fromISO(dateISO).getDay();for(const day of days)if(day>cur)return addDaysISO(dateISO,day-cur);return addDaysISO(dateISO,7*iv-cur+days[0])}return dateISO}
function recurrenceSummary(rec,dateISO){const f=rec?.freq;if(!f||f==='none')return'';const wd=dateISO?DOW[fromISO(dateISO).getDay()]:'';if(f==='daily')return'Every day';if(f==='weekly')return wd?`Every ${wd}`:'Every week';if(f==='biweekly')return wd?`Every 2 weeks on ${wd}`:'Every 2 weeks';if(f==='monthly')return dateISO?`Monthly on the ${ordinal(fromISO(dateISO).getDate())}`:'Every month';const iv=Math.max(1,rec.interval||1),names=(rec.days||[]).slice().sort((a,b)=>a-b).map(d=>DOW[d].slice(0,3)).join(', ');return`Every ${iv===1?'week':iv+' weeks'}${names?` on ${names}`:''}`}
function durationText(e){if(!e.date)return'';if(e.endDate&&e.endDate!==e.date){const days=daysBetweenISO(e.date,e.endDate)+1;if(days<=0)return'⚠ Ends before it starts';if(days%7===0)return`${days/7} week${days>7?'s':''}`;return`${days} days`}if(e.endTime&&e.time){const s=zonedUnix(e.date,e.time,e.timezone),x=zonedUnix(e.endDate||e.date,e.endTime,e.timezone);if(s&&x){const h=(x-s)/3600;if(h<=0)return'⚠ Ends before it starts';return h<1?`${Math.round(h*60)} minutes`:`${+h.toFixed(1)} hour${h>=2?'s':''}`}}return''}

function tileEvent(e){return `<div class="tile"><button class="fav ${e.favorite?'on':''} favSaved" data-id="${e.id}">${e.favorite?'★':'☆'}</button><h3>${esc(e.name||'Untitled Event')}</h3><p>${esc(e.preset||'Custom')} · ${e.date||'No date'}${e.recurrence&&e.recurrence.freq!=='none'?' · 🔁 '+esc(recurrenceSummary(e.recurrence,e.date)):''}</p><div class="chips">${(e.tags||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="actions" style="margin-top:12px"><button class="mini loadEvent" data-id="${e.id}">Open</button><button class="mini dupEvent" data-id="${e.id}">Duplicate</button><button class="mini copySaved" data-id="${e.id}">Copy</button><button class="mini historyEvent" data-id="${e.id}">History</button><button class="mini resultEvent" data-id="${e.id}">Results</button><button class="mini danger deleteEvent" data-id="${e.id}">Delete</button></div></div>`}
function tileTemplate(t){const locked=(t.fillIn||[]).length?`<span class="chip">✏️ Fill-in: ${(t.fillIn||[]).join(', ')}</span>`:'';return `<div class="tile"><button class="fav ${t.favorite?'on':''} favTemplate" data-id="${t.id}">${t.favorite?'★':'☆'}</button><h3>${esc(t.templateName)}</h3><p>${esc(t.category||'Other')} · ${esc(t.event.preset||'Custom')} · ${t.event.blocks.length} blocks ${t.inheritMaster?'· Master style':''}</p><div class="chips">${locked}${(t.event.tags||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="actions" style="margin-top:12px"><button class="mini useTemplate" data-id="${t.id}">Use</button><button class="mini previewTemplate" data-id="${t.id}">Preview</button><button class="mini shareTemplate" data-id="${t.id}">Share</button><button class="mini exportTemplate" data-id="${t.id}">⬇ Export</button><button class="mini applyMasterTemplate" data-id="${t.id}">Apply Master</button><button class="mini danger deleteTemplate" data-id="${t.id}">Delete</button></div></div>`}
function settingsView(){return `<div class="card"><div class="cardHead"><h2>Settings & Toolbox</h2></div><div class="body"><h3 style="margin-top:0">Clan Defaults</h3><div class="grid"><div class="field"><label>Clan Name</label><input id="sClan" value="${esc(state.settings.clan)}"></div><div class="field"><label>Default Timezone</label><select id="sTZ">${tzOptions(state.settings.timezone)}</select></div><div class="field"><label>Default World</label><input id="sWorld" value="${esc(state.settings.defaultWorld)}"></div><div class="field"><label>Default Meeting Location</label><input id="sLoc" value="${esc(state.settings.defaultLocation)}"></div></div><div class="divider"></div><h3>Master Template Style</h3><div class="grid"><div class="field full"><label>Global Footer <span class="hint">optional; appended to announcements</span></label>${textArea('masterFooter',state.settings.master.footer,'masterFooter')}</div></div><div class="hint" style="margin-top:8px">Master Style lets templates inherit your default block emojis and importance. Applying it never changes the actual event text.</div><div class="rowBtns" style="margin-top:10px"><button class="btn" id="editMasterStyle">Edit Master Block Defaults</button></div><div class="divider"></div><h3>Output Line Emoji</h3><div class="hint" style="margin-bottom:8px">Swap the emoji used on the core lines of every post (e.g. replace the flag on Ends with a clock). Leave one blank to remove it. The Minimal output style ignores these.</div><div class="grid">${[['when','When'],['starts','Starts'],['ends','Ends'],['world','World'],['meet','Meet'],['host','Host'],['repeat','Repeat note'],['rsvp','RSVP line'],['dink','Dink note']].map(([k,l])=>`<div class="field"><label>${l}</label><input class="lineEmojiInput" data-k="${k}" value="${esc(state.settings.lineEmoji[k]||'')}"></div>`).join('')}</div><div class="divider"></div><h3>Saved Discord Mentions</h3><div class="toolboxList">${state.mentions.map(m=>`<div class="smallCard"><strong>${esc(m.name)}</strong><div class="hint">${esc(m.code)}</div><div class="rowBtns" style="margin-top:8px"><button class="mini danger delMention" data-id="${m.id}">Delete</button></div></div>`).join('')||'<div class="hint">No mentions saved yet.</div>'}</div><button class="btn" id="addMention" style="margin-top:10px">+ Add Mention</button><div class="divider"></div><h3>Reusable Custom Fields</h3><div class="toolboxList">${state.customFields.map(f=>`<div class="smallCard"><strong>${esc(f.emoji||'📝')} ${esc(f.name)}</strong><div class="hint">${esc(f.defaultValue||'No default text')}</div><div class="rowBtns" style="margin-top:8px"><button class="mini danger delCustomField" data-id="${f.id}">Delete</button></div></div>`).join('')||'<div class="hint">No custom fields saved yet. Save any block as a reusable field from Create.</div>'}</div><button class="btn" id="addCustomField" style="margin-top:10px">+ Add Custom Field</button><div class="divider"></div><h3>Backup & Restore</h3><div class="rowBtns"><button class="btn gold" id="exportBackup">⬇ Export Full Backup</button><button class="btn" id="importBackup">⬆ Import Backup</button><button class="btn" id="copyBackup">📋 Copy Backup</button><button class="btn" id="pasteBackup">📥 Paste Backup</button></div><div class="hint" style="margin-top:8px">Backup includes saved events, templates, custom fields, mentions, settings, versions, and the current draft. On a phone, the clipboard route is easiest: <strong>Copy Backup</strong> here, send the text to yourself (notes app, Discord DM), then <strong>Paste Backup</strong> on the other device — no files involved.</div><div class="divider"></div><h3>Offline / Portable App</h3><div class="rowBtns"><button class="btn gold" id="downloadApp">💾 Download EventForge</button></div><div class="hint" style="margin-top:8px">Saves the entire tool as a single <strong>eventforge.html</strong> file. Open it in any browser — phone or computer — and it works fully offline: no internet, no install. The downloaded copy keeps its own separate data, so use Export Full Backup here and Import Backup there to carry your events and templates over.</div><div class="divider"></div><div class="rowBtns"><button class="btn gold" id="saveSettings">Save Settings</button><button class="btn danger" id="wipeData">Reset App Data</button></div></div></div>`}
// Shared saves state
let sharedSaves = [];
let sharedLoading = false;
let sharedError = '';

function getUser() {
  let u = localStorage.getItem('mm-eventforge-user');
  if (!u) {
    u = prompt('Enter your display name (shown when you save):');
    if (u) localStorage.setItem('mm-eventforge-user', u.trim());
  }
  return (u || '').trim();
}

async function fetchShared() {
  sharedLoading = true;
  sharedError = '';
  renderSharedContent();
  try {
    const res = await fetch('/api/eventforge');
    if (!res.ok) throw new Error('API error');
    const data = await res.json();
    sharedSaves = data.saves || [];
  } catch (e) {
    sharedError = 'Could not load shared saves';
    sharedSaves = [];
  }
  sharedLoading = false;
  renderSharedContent();
}

function renderSharedContent() {
  const el = document.getElementById('sharedContent');
  if (!el) return;
  if (sharedLoading) { el.innerHTML = '<div class="hint">Loading shared saves...</div>'; return; }
  if (sharedError) { el.innerHTML = '<div class="hint warning">' + esc(sharedError) + '</div>'; return; }
  const evts = sharedSaves.filter(s => s.type === 'event');
  const tpls = sharedSaves.filter(s => s.type === 'template');
  let html = '';
  if (evts.length) {
    html += '<h3 style="margin:0 0 10px">Shared Events</h3><div class="templateGrid">' + evts.map(sharedTile).join('') + '</div>';
  }
  if (tpls.length) {
    html += '<h3 style="margin:18px 0 10px">Shared Templates</h3><div class="templateGrid">' + tpls.map(sharedTile).join('') + '</div>';
  }
  if (!evts.length && !tpls.length) {
    html = '<div class="hint">No shared saves yet. Save an event or template to share it with the clan.</div>';
  }
  el.innerHTML = html;
  bindSharedItems();
}

function sharedTile(s) {
  const ago = timeAgo(s.updated_at);
  return '<div class="tile"><span class="chip" style="position:absolute;right:10px;top:10px">' + esc(s.category) + '</span><h3>' + esc(s.name) + '</h3><p>' + esc(s.type) + ' · v' + s.version + ' · ' + esc(s.updated_by) + ' · ' + ago + '</p><div class="actions" style="margin-top:12px"><button class="mini loadShared" data-id="' + s.id + '">Load</button><button class="mini updateShared" data-id="' + s.id + '">Update</button><button class="mini danger deleteShared" data-id="' + s.id + '">Delete</button></div></div>';
}

function timeAgo(iso) {
  const sec = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (sec < 60) return 'just now';
  if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
  if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
  return Math.floor(sec / 86400) + 'd ago';
}

function sharedView() {
  return '<div class="card"><div class="cardHead"><h2>Shared Saves</h2><span class="spacer"></span><button class="btn gold" id="shareCurrentBtn">Share Current Event</button><button class="btn" id="shareAsTemplateBtn">Share as Template</button></div><div class="body"><div class="hint" style="margin-bottom:14px">Events and templates saved here are visible to all clan leaders. Pick a clear name and category.</div><div id="sharedContent"><div class="hint">Loading...</div></div></div></div>';
}

function bindShared() {
  document.getElementById('shareCurrentBtn')?.addEventListener('click', () => shareToCloud('event'));
  document.getElementById('shareAsTemplateBtn')?.addEventListener('click', () => shareToCloud('template'));
  bindSharedItems();
}

function bindSharedItems() {
  document.querySelectorAll('.loadShared').forEach(x => x.onclick = () => loadFromCloud(x.dataset.id));
  document.querySelectorAll('.updateShared').forEach(x => x.onclick = () => updateInCloud(x.dataset.id));
  document.querySelectorAll('.deleteShared').forEach(x => x.onclick = () => deleteFromCloud(x.dataset.id));
}

function shareToCloud(type) {
  const user = getUser();
  if (!user) { toast('Name required to save'); return; }
  const cats = ['PvM', 'Skilling', 'Minigame', 'Social', 'Competition', 'Other'];
  const guess = { 'PvM Mass': 'PvM', 'PK Trip': 'PvM', 'Competition': 'Competition', 'Skilling': 'Skilling', 'Minigame': 'Minigame', 'Social': 'Social', 'Hide & Seek': 'Minigame', 'Training': 'PvM' }[state.event.preset] || 'Other';
  showModal('Share ' + (type === 'template' ? 'Template' : 'Event'), '<div class="field"><label>Name <span class="req">*</span></label><input id="shareName" value="' + esc(state.event.name || '') + '" placeholder="Weekend CoX Mass"></div><div class="field" style="margin-top:10px"><label>Category <span class="req">*</span></label><select id="shareCat">' + cats.map(c => '<option ' + (c === guess ? 'selected' : '') + '>' + c + '</option>').join('') + '</select></div>', async () => {
    const name = document.getElementById('shareName').value.trim();
    const category = document.getElementById('shareCat').value;
    if (!name) { toast('Name is required'); return; }
    try {
      const body = { type, name, category, user, data: type === 'template' ? { templateName: name, category, event: clone(state.event) } : clone(state.event) };
      const res = await fetch('/api/eventforge', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!res.ok) throw new Error('Save failed');
      const result = await res.json();
      state.event._sharedId = result.save.id;
      state.event._sharedVersion = result.save.version;
      markDirty();
      closeModal();
      toast('Shared with clan');
      fetchShared();
    } catch (e) { toast('Save failed -- try again'); }
  });
}

async function loadFromCloud(id) {
  try {
    const res = await fetch('/api/eventforge?id=' + encodeURIComponent(id));
    if (!res.ok) throw new Error();
    const { save } = await res.json();
    const data = JSON.parse(save.data);
    if (save.type === 'template') {
      const tpl = data;
      const e = eventDefaults(clone(tpl.event || data));
      e.id = uid();
      e._sharedId = save.id;
      e._sharedVersion = save.version;
      state.event = e;
    } else {
      const e = eventDefaults(clone(data));
      e._sharedId = save.id;
      e._sharedVersion = save.version;
      state.event = e;
    }
    state.route = 'create';
    markDirty();
    render();
    toast('Loaded "' + save.name + '"');
  } catch { toast('Failed to load'); }
}

async function updateInCloud(id) {
  const user = getUser();
  if (!user) { toast('Name required'); return; }
  const save = sharedSaves.find(s => s.id === id);
  if (!save) return;
  const localVersion = state.event._sharedVersion || save.version;
  try {
    const res = await fetch('/api/eventforge', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, name: save.name, category: save.category, data: clone(state.event), user, version: localVersion })
    });
    const result = await res.json();
    if (res.status === 409) {
      showModal('Version Conflict', '<p>' + esc(result.updatedBy) + ' saved a newer version (' + timeAgo(result.updatedAt) + '). Load their version first, or force overwrite.</p>', async () => {
        const r2 = await fetch('/api/eventforge', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, name: save.name, category: save.category, data: clone(state.event), user, version: result.currentVersion })
        });
        if (r2.ok) {
          const r2j = await r2.json();
          state.event._sharedVersion = r2j.save.version;
          markDirty();
          closeModal();
          toast('Force saved');
          fetchShared();
        } else { toast('Save failed'); }
      });
      document.getElementById('mSave').textContent = 'Force Overwrite';
      const cancelBtn = document.getElementById('mCancel');
      cancelBtn.textContent = 'Load Theirs';
      cancelBtn.onclick = () => { closeModal(); loadFromCloud(id); };
      return;
    }
    if (!res.ok) throw new Error();
    state.event._sharedVersion = result.save.version;
    markDirty();
    toast('Updated shared save');
    fetchShared();
  } catch { toast('Update failed'); }
}

async function deleteFromCloud(id) {
  showModal('Delete Shared Save', '<p>This removes the save for everyone. Are you sure?</p>', async () => {
    try {
      await fetch('/api/eventforge', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
      closeModal();
      toast('Deleted');
      fetchShared();
    } catch { toast('Delete failed'); }
  });
}

function tzOptions(sel){return ['America/New_York','America/Chicago','America/Denver','America/Los_Angeles','UTC','Europe/London','Europe/Berlin','Australia/Sydney'].map(x=>`<option ${sel===x?'selected':''}>${x}</option>`).join('')}
function completeness(){let score=0,issues=[];const checks=[[!!state.event.name,25,'Add an event name'],[!!state.event.date,20,'Choose a date'],[!!state.event.time,15,'Choose a time'],[state.event.blocks.some(b=>b.kind==='details'&&b.world),15,'Add a world'],[state.event.blocks.some(b=>b.kind==='details'&&b.location),15,'Add a starting location'],[state.event.blocks.some(b=>hasContent(b)),10,'Add at least one announcement section']];checks.forEach(([ok,pts,msg])=>ok?score+=pts:issues.push(msg));return{score,issues}}
function hasContent(b){if(!b.visible)return false;if(b.items)return b.items.some(x=>x.trim());if(b.kind==='details')return !!(b.world||b.location||b.host);if(b.kind==='training')return !!(b.date||b.details);return !!(b.value||b.provided)}
function conditionOK(b){if(!b.visible)return false;if(!b.condition||b.condition==='always')return true;if(b.condition==='hasPrize')return state.event.blocks.some(x=>x.kind==='prizes'&&hasContent(x));if(b.condition==='hasEnd')return !!(state.event.endDate||state.event.endTime);if(b.condition==='competition')return state.event.preset==='Competition';if(b.condition==='pk')return state.event.preset==='PK Trip';return true}
function lem(k){if(state.outputStyle==='minimal')return'';const v=(state.settings.lineEmoji||defaultLineEmoji())[k];return v?v+' ':''}
function importancePrefix(b){if(!b.showLabel)return'';const emo=state.outputStyle==='minimal'?'':(b.emoji||'');const title=`${emo} ${b.label||''}`.trim();if(b.importance==='featured')return `# ${title}`;if(b.importance==='medium')return `## ${title}`;if(b.importance==='small')return `${emo} **${b.label}:**`.trim();return `### ${title}`}
function zonedUnix(date,time,tz){if(!date||!time)return null;const [Y,M,D]=date.split('-').map(Number),[h,m]=time.split(':').map(Number);let guess=Date.UTC(Y,M-1,D,h,m,0);for(let k=0;k<3;k++){const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(guess));const get=t=>+parts.find(p=>p.type===t).value;const asUTC=Date.UTC(get('year'),get('month')-1,get('day'),get('hour'),get('minute'));guess+=Date.UTC(Y,M-1,D,h,m)-asUTC}return Math.floor(guess/1000)}
function mainTimestamp(style='F'){const u=zonedUnix(state.event.date,state.event.time,state.event.timezone);return u?`<t:${u}:${style}>`:''}
function blockToText(b){if(!conditionOK(b))return'';if(b.kind==='spacer')return '\n';if(b.kind==='divider')return'────────────';const head=importancePrefix(b);let content='';if(b.kind==='details'){const lines=[];if(b.world)lines.push(`${lem('world')}**World:** ${b.world}`);if(b.location)lines.push(`${lem('meet')}**Meet:** ${b.location}`);if(b.host)lines.push(`${lem('host')}**Host:** ${b.host}`);content=lines.join('\n')}else if(['requirements','rules','prizes'].includes(b.kind)){content=(b.items||[]).filter(x=>x.trim()).map(x=>x.trim().match(/^(\d+[.)]|[-•*])/)?x:`• ${x}`).join('\n')}else if(b.kind==='gear'){const lines=[];if(b.provided)lines.push(`**Provided by clan:** ${b.provided}`);if(b.value)lines.push(b.value);content=lines.join('\n')}else if(b.kind==='training'){const lines=[];if(b.name&&b.name!==b.label)lines.push(`**${b.name}**`);const u=zonedUnix(b.date,b.time,b.timezone||state.event.timezone);if(u)lines.push(`${lem('when')}<t:${u}:F>\n${lem('starts')}<t:${u}:R>`);if(b.world)lines.push(`${lem('world')}**World:** ${b.world}`);if(b.location)lines.push(`${lem('meet')}**Meet:** ${b.location}`);if(b.details)lines.push(b.details);content=lines.join('\n')}else content=b.value||'';if(!head)return content;if(b.importance==='small'&&content&&!content.includes('\n'))return `${head} ${content}`;return [head,content].filter(Boolean).join('\n')}
function announcementPost(){if(state.outputStyle==='compact')return compactPost();const e=state.event,arr=[];if(e.name)arr.push(`# ${e.name}`);const su=zonedUnix(e.date,e.time,e.timezone),multi=e.endDate&&e.endDate!==e.date,eu=(e.endDate||e.endTime)?zonedUnix(e.endDate||e.date,e.endTime||e.time,e.timezone):null;if(su){if(multi&&eu)arr.push(`${lem('when')}**When:** <t:${su}:D> — <t:${eu}:D>\n${lem('starts')}**Starts:** <t:${su}:F> (<t:${su}:R>)`);else arr.push(`${lem('when')}**When:** <t:${su}:F>\n${lem('starts')}**Starts:** <t:${su}:R>`)}if(eu)arr.push(`${lem('ends')}**Ends:** <t:${eu}:F>`);e.blocks.forEach(b=>{const t=blockToText(b);if(t)arr.push(t)});const extras=extraLines();if(extras)arr.push(extras);if(state.settings.master.footer)arr.push(state.settings.master.footer);return arr.join('\n\n').trim()}
function extraLines(){const e=state.event,out=[];if(e.repeatNote&&e.recurrence?.freq!=='none'){const s=recurrenceSummary(e.recurrence,e.date);if(s)out.push(`${lem('repeat')}*Repeats: ${s}*`)}if(e.rsvp)out.push(`${lem('rsvp')}**React with ${e.rsvpEmoji||'✅'} if you plan to make it!**`);if(e.dinkNote)out.push(`${lem('dink')}*Running **Dink**? Keep it on so your drops and highlights post straight to Discord.*`);return out.join('\n')}
function compactPost(){const e=state.event,d=e.blocks.find(b=>b.kind==='details'&&b.visible),su=zonedUnix(e.date,e.time,e.timezone),parts=[`**${e.name||'Event'}**`];if(su)parts.push(`<t:${su}:f>`);if(e.endDate&&e.endDate!==e.date){const eu=zonedUnix(e.endDate,e.endTime||e.time,e.timezone);if(eu)parts.push(`ends <t:${eu}:d>`)}if(d?.world)parts.push(`${lem('world')}W${d.world}`);if(d?.location)parts.push(`${lem('meet')}${d.location}`);let out=parts.join(' • ');if(e.repeatNote&&e.recurrence?.freq!=='none'){const s=recurrenceSummary(e.recurrence,e.date);if(s)out+=` • ${lem('repeat')}${s}`}if(e.rsvp)out+=`\n${lem('rsvp')}React ${e.rsvpEmoji||'✅'} if you're in!`;return out}

/* --- Shared Saves (D1 cloud storage) --- */
const SHARED_USER_KEY='mm-eventforge-user';
const SHARED_CATS=['PvM','Skilling','Minigame','Social','Competition','Other'];
let _sharedCache=null;
let _sharedLoading=false;

function getSharedUser(){try{return localStorage.getItem(SHARED_USER_KEY)}catch(e){return null}}
function setSharedUser(name){try{localStorage.setItem(SHARED_USER_KEY,name)}catch(e){}}
function ensureSharedUser(){
  let u=getSharedUser();
  if(u)return u;
  u=prompt('Enter your name (RSN or Discord name):');
  if(!u||!u.trim())return null;
  u=u.trim();setSharedUser(u);return u;
}

async function fetchSharedList(force){
  if(_sharedCache&&!force)return _sharedCache;
  _sharedLoading=true;
  try{
    const r=await fetch('/api/eventforge');
    if(!r.ok)throw new Error('API error');
    const d=await r.json();
    _sharedCache=d.saves||[];
    return _sharedCache;
  }catch(e){toast('Could not load shared saves');return _sharedCache||[]}
  finally{_sharedLoading=false}
}
async function fetchSharedItem(id){
  const r=await fetch('/api/eventforge?id='+encodeURIComponent(id));
  if(!r.ok)throw new Error('Not found');
  return r.json();
}
async function saveToCloud(type,name,category,data){
  const user=ensureSharedUser();if(!user)return null;
  const r=await fetch('/api/eventforge',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type,name,category,data,user})});
  if(!r.ok){const e=await r.json().catch(()=>({}));toast(e.error||'Save failed');return null}
  _sharedCache=null;
  return r.json();
}
async function updateInCloud(id,version,updates){
  const user=ensureSharedUser();if(!user)return null;
  const body={id,version,user,...updates};
  const r=await fetch('/api/eventforge',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  if(r.status===409){
    const conflict=await r.json();
    const overwrite=confirm(`This save was updated by ${conflict.updatedBy} at ${new Date(conflict.updatedAt).toLocaleString()}.\n\nDo you want to overwrite their changes?`);
    if(overwrite){
      body.version=conflict.currentVersion;
      const r2=await fetch('/api/eventforge',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
      if(!r2.ok){toast('Overwrite failed');return null}
      _sharedCache=null;return r2.json();
    }
    return null;
  }
  if(!r.ok){const e=await r.json().catch(()=>({}));toast(e.error||'Update failed');return null}
  _sharedCache=null;return r.json();
}
async function deleteFromCloud(id){
  const r=await fetch('/api/eventforge',{method:'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify({id})});
  if(!r.ok){toast('Delete failed');return false}
  _sharedCache=null;return true;
}

function sharedView(){
  const list=_sharedCache||[];
  const userDisplay=getSharedUser();
  const events=list.filter(s=>s.type==='event');
  const templates=list.filter(s=>s.type==='template');
  return `<div class="card"><div class="cardHead"><h2>Shared Saves</h2><span class="spacer"></span>${userDisplay?`<span class="hint" style="cursor:pointer" id="changeSharedUser" title="Click to change">Logged in as <strong>${esc(userDisplay)}</strong></span>`:`<button class="btn" id="setSharedUser">Set Your Name</button>`}</div><div class="body">
    <div class="hint" style="margin-bottom:14px">Saves visible to all clan leaders. Share events and templates so anyone can load, edit, and reuse them.</div>
    <div class="rowBtns" style="margin-bottom:16px">
      <button class="btn gold" id="shareCurrentEvent">☁️ Share Current Event</button>
      <button class="btn" id="shareCurrentTemplate">☁️ Share as Template</button>
      <button class="btn" id="refreshShared">🔄 Refresh</button>
    </div>
    ${events.length?`<h3 style="margin:16px 0 8px">Events (${events.length})</h3><div class="shared-list">${events.map(sharedItemHtml).join('')}</div>`:''}
    ${templates.length?`<h3 style="margin:16px 0 8px">Templates (${templates.length})</h3><div class="shared-list">${templates.map(sharedItemHtml).join('')}</div>`:''}
    ${!events.length&&!templates.length?`<div class="shared-empty">${_sharedLoading?'Loading...':'No shared saves yet. Share an event or template to get started.'}</div>`:''}
  </div></div>`;
}

function sharedItemHtml(s){
  const icon=s.type==='event'?'📅':'🧩';
  const ago=timeAgo(s.updated_at);
  return `<div class="shared-item" data-id="${s.id}" data-type="${s.type}">
    <div class="si-icon">${icon}</div>
    <div class="si-info"><div class="si-name">${esc(s.name)}</div><div class="si-meta">by ${esc(s.updated_by)} ${ago}</div></div>
    <span class="si-cat">${esc(s.category)}</span>
    <div class="si-actions">
      <button class="mini loadShared" data-id="${s.id}" data-type="${s.type}">Load</button>
      <button class="mini danger deleteShared" data-id="${s.id}">✕</button>
    </div>
  </div>`;
}

function timeAgo(iso){
  if(!iso)return '';
  const d=Date.now()-new Date(iso).getTime();
  if(d<60000)return 'just now';
  if(d<3600000)return Math.floor(d/60000)+'m ago';
  if(d<86400000)return Math.floor(d/3600000)+'h ago';
  return Math.floor(d/86400000)+'d ago';
}

function bindShared(){
  document.getElementById('changeSharedUser')?.addEventListener('click',()=>{
    const cur=getSharedUser()||'';
    const u=prompt('Enter your name (RSN or Discord name):',cur);
    if(u&&u.trim()){setSharedUser(u.trim());render()}
  });
  document.getElementById('setSharedUser')?.addEventListener('click',()=>{
    const u=ensureSharedUser();if(u)render();
  });
  document.getElementById('refreshShared')?.addEventListener('click',async()=>{
    toast('Refreshing...');await fetchSharedList(true);render();
  });
  document.getElementById('shareCurrentEvent')?.addEventListener('click',()=>shareCurrentToCloud('event'));
  document.getElementById('shareCurrentTemplate')?.addEventListener('click',()=>shareCurrentToCloud('template'));
  document.querySelectorAll('.loadShared').forEach(x=>x.addEventListener('click',async(e)=>{
    e.stopPropagation();
    const id=x.dataset.id;
    try{
      const item=await fetchSharedItem(id);
      const data=typeof item.data==='string'?JSON.parse(item.data):item.data;
      if(item.type==='template'){
        const t={id:uid(),templateName:item.name,category:item.category||'Other',fillIn:[],event:eventDefaults(clone(data)),inheritMaster:false,favorite:false,_cloudId:item.id,_cloudVersion:item.version};
        state.templates.unshift(t);persist();
        toast('Template loaded to your Templates tab');
      }else{
        state.event=eventDefaults(clone(data));
        state.event._cloudId=item.id;
        state.event._cloudVersion=item.version;
        state.event._cloudName=item.name;
        state.event._cloudCategory=item.category;
        state.route='create';markDirty();
        toast('Event loaded to editor');
      }
      render();
    }catch(err){toast('Failed to load save')}
  }));
  document.querySelectorAll('.deleteShared').forEach(x=>x.addEventListener('click',async(e)=>{
    e.stopPropagation();
    if(!confirm('Delete this shared save? This cannot be undone.'))return;
    if(await deleteFromCloud(x.dataset.id)){toast('Deleted');await fetchSharedList(true);render()}
  }));
}

function shareCurrentToCloud(type){
  const user=ensureSharedUser();if(!user)return;
  const e=state.event;
  const guess={'PvM Mass':'PvM','PK Trip':'PvM','Competition':'Competition','Skilling':'Skilling','Minigame':'Minigame','Social':'Social','Hide & Seek':'Minigame','Training':'PvM'}[e.preset]||'Other';
  showModal('Share to Cloud',`
    <div class="field"><label>Name <span class="req">*</span></label><input id="shareName" value="${esc(e.name||'')}" placeholder="${type==='template'?'Weekend PK Template':'Friday PK Event'}"></div>
    <div class="field" style="margin-top:10px"><label>Category <span class="req">*</span></label><select id="shareCat">${SHARED_CATS.map(c=>`<option ${c===guess?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="hint" style="margin-top:10px">This will be visible to all clan leaders on the Shared tab.</div>
  `,async()=>{
    const name=document.getElementById('shareName').value.trim();
    const cat=document.getElementById('shareCat').value;
    if(!name){toast('Name is required');return}
    const data=clone(state.event);
    delete data._cloudId;delete data._cloudVersion;delete data._cloudName;delete data._cloudCategory;
    const result=await saveToCloud(type,name,cat,data);
    if(result){
      if(type==='event'){state.event._cloudId=result.id;state.event._cloudVersion=result.version;state.event._cloudName=name;state.event._cloudCategory=cat}
      closeModal();toast('Shared to cloud');await fetchSharedList(true);
    }
  });
}

fetchSharedList(false);
render();
checkTemplateImport();

<script>
/* ============================================================
   EventForge QoL enhancement layer (additive — no app logic changed)
   1) Text selection inside draggable blocks
   2) Spellcheck + autocapitalize + autocorrect (spelling / caps / word suggestions)
   3) Auto-growing textareas
   4) Discord 2000-char limit meter
   5) Keyboard shortcuts: Ctrl/Cmd+S = Save Event, Ctrl/Cmd+Enter = Copy to Discord
   ============================================================ */
(function(){
  var app=document.getElementById('app'); if(!app) return;
  var FIELD='input,textarea,select';

  /* 1) A block is draggable="true"; pressing a field inside it starts a drag
        instead of selecting text. Disable the block's drag the moment a field
        is pressed, restore it on release — so highlighting works, reorder still does too. */
  document.addEventListener('pointerdown',function(e){
    var f=e.target.closest(FIELD); if(!f) return;
    var bl=f.closest('.block'); if(bl){ bl.setAttribute('data-nodrag','1'); bl.setAttribute('draggable','false'); }
  },true);
  function restoreDrag(){ document.querySelectorAll('.block[data-nodrag]').forEach(function(bl){ bl.removeAttribute('data-nodrag'); bl.setAttribute('draggable','true'); }); }
  document.addEventListener('pointerup',restoreDrag,true);
  document.addEventListener('pointercancel',restoreDrag,true);
  /* never let a drag start from within a field (belt & suspenders) */
  document.addEventListener('dragstart',function(e){ if(e.target.closest(FIELD)||e.target.closest('a,label')) e.preventDefault(); },true);

  /* 2/3) enhance fields after every render */
  function isTexty(el){
    if(el.tagName==='TEXTAREA') return true;
    var t=(el.getAttribute('type')||'text').toLowerCase();
    return el.tagName==='INPUT' && (t==='text'||t==='search'||t==='');
  }
  function enhance(){
    app.querySelectorAll('textarea, input').forEach(function(el){
      if(isTexty(el)){
        el.setAttribute('spellcheck','true');
        el.setAttribute('autocorrect','on');
        var idc=(el.id+' '+el.className).toLowerCase();
        if(el.id==='eventName') el.setAttribute('autocapitalize','characters');            /* event name -> ALL CAPS keyboard */
        else if(!/world|url|link|code|time|date|number|host|leader/.test(idc)) el.setAttribute('autocapitalize','sentences');
        if(!el.getAttribute('autocomplete')) el.setAttribute('autocomplete','on');
      }
      if(el.tagName==='TEXTAREA' && !el.dataset.grow){
        el.dataset.grow='1';
        var grow=function(){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; };  /* grow to fit, uncapped */
        el.addEventListener('input',grow);
        requestAnimationFrame(grow);
      }
    });
    /* 4) Discord 2000-char limit meter */
    var cc=document.getElementById('charCount');
    if(cc){
      var mm=(cc.textContent||'').match(/\d[\d,]*/);            /* first number only — never re-parse our own "/ 2000" suffix */
      var n=mm?parseInt(mm[0].replace(/,/g,''),10):0;
      var want=n.toLocaleString()+' / 2000';
      if(cc.textContent!==want) cc.textContent=want;
      cc.classList.toggle('over',n>2000);
      cc.classList.toggle('warn',n>=1600&&n<=2000);
    }
  }

  /* run enhance on load + on every re-render, without self-triggering the observer */
  var pending=false, cfg={childList:true,subtree:true};
  var obs=new MutationObserver(function(){
    if(pending) return; pending=true;
    requestAnimationFrame(function(){ pending=false; obs.disconnect(); try{enhance();}catch(_){}; obs.observe(app,cfg); });
  });
  try{ enhance(); }catch(_){}
  obs.observe(app,cfg);

  /* 5) keyboard shortcuts (don't clash with the app's Ctrl+B/I/U inside fields) */
  document.addEventListener('keydown',function(e){
    if(!(e.ctrlKey||e.metaKey)) return;
    var k=(e.key||'').toLowerCase();
    if(k==='s'){ e.preventDefault(); var b=document.getElementById('saveEventBtn'); if(b) b.click(); }
    else if(k==='enter'){ e.preventDefault(); var c=document.getElementById('copyBtn')||document.getElementById('bottomCopy'); if(c) c.click(); }
  });

  /* 6) Preview inline editing — click-to-edit in the Discord preview, changes save back to state + form */
  document.addEventListener('keydown',function(e){
    var pe=e.target.closest&&e.target.closest('.pedit');if(!pe)return;
    if(e.key==='Enter'&&!pe.classList.contains('pedit-ml')){e.preventDefault();pe.blur()}
    if(e.key==='Escape')pe.blur();
  },true);
  document.addEventListener('paste',function(e){
    var pe=e.target.closest&&e.target.closest('.pedit');if(!pe)return;
    e.preventDefault();
    var text=(e.clipboardData||window.clipboardData).getData('text/plain');
    document.execCommand('insertText',false,text);
  },true);
  document.addEventListener('focusout',function(e){
    var pe=e.target.closest&&e.target.closest('.pedit');
    if(!pe||!pe.closest('.discordMsg'))return;
    var field=pe.dataset.field,bid=pe.dataset.bid,idx=pe.dataset.idx,val=pe.innerText||'';
    if(field==='eventName'){state.event.name=val;var el=document.getElementById('eventName');if(el)el.value=val}
    else if(bid){var b=state.event.blocks.find(function(x){return x.id===bid});if(!b)return;var blEl=document.querySelector('.block[data-id="'+bid+'"]');if(field==='label'){b.label=val;if(blEl){var l=blEl.querySelector('.bLabel');if(l)l.value=val}}else if(field==='item'&&idx!=null){b.items[+idx]=val;if(blEl){var li=blEl.querySelector('.listItem[data-j="'+idx+'"]');if(li)li.value=val}}else if(field==='world'){b.world=val;if(blEl){var w=blEl.querySelector('.dWorld,.sWorld');if(w)w.value=val}}else if(field==='location'){b.location=val;if(blEl){var l2=blEl.querySelector('.dLocation,.sLocation');if(l2)l2.value=val}}else if(field==='host'){b.host=val;if(blEl){var h=blEl.querySelector('.dHost');if(h)h.value=val}}else if(field==='value'){b.value=val;if(blEl){var v=blEl.querySelector('.bValue');if(v)v.value=val}}else if(field==='name'){b.name=val;if(blEl){var n2=blEl.querySelector('.sName');if(n2)n2.value=val}}else if(field==='details'){b.details=val;if(blEl){var d=blEl.querySelector('.sDetails');if(d)d.value=val}}}
    markDirty();
    var raw=generatePost(),r=document.querySelector('.raw'),cc=document.getElementById('charCount');
    if(r)r.textContent=raw;
    if(cc){var len=raw.length;cc.textContent=len+' chars'+(len>2000?' ⚠️':'');cc.classList.toggle('over',len>2000);cc.classList.toggle('warn',len>=1600&&len<=2000)}
  },true);
})();
</script>
