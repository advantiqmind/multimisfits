<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>File Cabinet | Multi-Misfits</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="theme-color" content="#0d0a05">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@400;500;600&family=Jersey+15&display=swap" rel="stylesheet">
<style>
:root {
  --bg-void: #0d0a05;
  --bg-panel: #13100a;
  --bg-card: #1a1209;
  --bg-hover: #221a0e;
  --bg-input: #110e08;
  --gold: #d4a017;
  --gold-dim: #8b6914;
  --gold-bright: #e8c547;
  --gold-muted: #6b5210;
  --text: #c9b88a;
  --text-dim: #8a7a55;
  --text-bright: #e6d9b8;
  --border: #2a2010;
  --border-light: #3a2f1a;
  --bronze: #6b5836;
  --red: #a03030;
  --red-dim: #7a2020;
  --green: #2a7a3a;
  --blue: #2a5a8a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg-void);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Lock screen ── */
.lock-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background:
    radial-gradient(800px 400px at 50% 30%, #1a1305 0%, transparent 60%),
    var(--bg-void);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.lock-box {
  text-align: center;
  max-width: 360px;
  width: 100%;
}

.lock-icon {
  font-size: 48px;
  margin-bottom: 20px;
  opacity: 0.6;
}

.lock-title {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 22px;
  color: var(--gold);
  letter-spacing: 3px;
  margin-bottom: 8px;
}

.lock-sub {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 28px;
  letter-spacing: 1px;
}

.lock-input {
  width: 100%;
  padding: 12px 16px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  text-align: center;
  letter-spacing: 2px;
  outline: none;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}
.lock-input:focus { border-color: var(--gold-dim); }
.lock-input::placeholder { color: var(--text-dim); letter-spacing: 1px; }

.lock-btn {
  width: 100%;
  padding: 12px;
  background: rgba(212,160,23,0.12);
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2px;
  cursor: pointer;
  transition: background 0.2s;
}
.lock-btn:hover { background: rgba(212,160,23,0.2); }

.lock-error {
  margin-top: 12px;
  font-size: 12px;
  color: var(--red);
  min-height: 18px;
}

.lock-back {
  margin-top: 24px;
  font-size: 12px;
}
.lock-back a {
  color: var(--text-dim);
  text-decoration: none;
  letter-spacing: 1px;
}
.lock-back a:hover { color: var(--gold-dim); }

/* ── Nav bar ── */
.arm-nav {
  display: flex;
  align-items: center;
  padding: 10px 20px;
  background: #1a1509;
  border-bottom: 1px solid var(--border);
  gap: 16px;
  flex-wrap: wrap;
}
.arm-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.arm-brand img {
  width: 28px;
  height: 28px;
}
.arm-brand span {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 13px;
  color: var(--gold);
  letter-spacing: 2px;
}
.arm-links {
  display: flex;
  gap: 4px;
  flex: 1;
}
.arm-links a {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  text-decoration: none;
  letter-spacing: 1px;
  padding: 6px 10px;
  transition: color 0.2s;
}
.arm-links a:hover { color: var(--gold); }
.arm-links a.active { color: var(--gold); background: rgba(212,160,23,0.08); }
.arm-user {
  font-size: 11px;
  color: var(--text-dim);
  cursor: pointer;
  letter-spacing: 0.5px;
}
.arm-user:hover { color: var(--gold-dim); }

/* ── Layout ── */
.fc-layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: calc(100vh - 48px);
}

/* ── Sidebar ── */
.fc-sidebar {
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.fc-sidebar-head {
  padding: 16px 14px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.fc-sidebar-title {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 13px;
  color: var(--gold);
  letter-spacing: 2px;
}

.fc-sidebar-actions {
  display: flex;
  gap: 6px;
}

.fc-sidebar-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 10px;
  padding: 3px 8px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: border-color 0.2s, color 0.2s;
}
.fc-sidebar-btn:hover { border-color: var(--gold-dim); color: var(--gold-dim); }
.fc-sidebar-btn.active { border-color: var(--gold-dim); color: var(--gold); }

/* Mobile folder toggle (hidden on desktop) */
.fc-mob-current {
  display: none;
}

.fc-folder-list {
  flex: 1;
  padding: 6px 0;
}

.fc-folder {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  cursor: pointer;
  transition: background 0.12s;
  border-left: 3px solid transparent;
}
.fc-folder:hover { background: var(--bg-hover); }
.fc-folder.active {
  background: rgba(212,160,23,0.06);
  border-left-color: var(--gold);
}
.fc-folder.active .fc-folder-name { color: var(--gold); }

.fc-folder-emoji { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
.fc-folder-name {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.5px;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.fc-folder-count {
  font-family: 'Jersey 15', monospace;
  font-size: 13px;
  color: var(--text-dim);
  background: var(--bg-void);
  padding: 0 6px;
  border: 1px solid var(--border);
  min-width: 22px;
  text-align: center;
}

.fc-sidebar-foot {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
}

.fc-add-folder-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  background: none;
  border: 1px dashed var(--border-light);
  color: var(--text-dim);
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 1px;
  cursor: pointer;
  width: 100%;
  transition: border-color 0.2s, color 0.2s;
}
.fc-add-folder-btn:hover { border-color: var(--gold-dim); color: var(--gold-dim); }

/* ── Main content ── */
.fc-main {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* Search bar */
.fc-search-bar {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: center;
  background: var(--bg-panel);
}

.fc-search-wrap {
  flex: 1;
  position: relative;
}

.fc-search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  color: var(--text-dim);
  pointer-events: none;
}

.fc-search-input {
  width: 100%;
  padding: 9px 10px 9px 34px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.fc-search-input:focus { border-color: var(--gold-dim); }
.fc-search-input::placeholder { color: var(--text-dim); }

.fc-scope-btn {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  color: var(--text-dim);
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 6px 10px;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color 0.2s;
}
.fc-scope-btn:hover { border-color: var(--gold-dim); }
.fc-scope-btn.all { color: var(--gold-dim); border-color: var(--gold-muted); }

/* Folder header */
.fc-folder-header {
  padding: 16px 20px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}

.fc-folder-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.fc-folder-header-emoji { font-size: 24px; }
.fc-folder-header-name {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--gold);
  letter-spacing: 1px;
}
.fc-folder-header-count {
  font-family: 'Jersey 15', monospace;
  font-size: 14px;
  color: var(--text-dim);
}
.fc-folder-header-desc {
  width: 100%;
  font-size: 12px;
  color: var(--text-dim);
  margin-top: -4px;
  padding-left: 36px;
}

.fc-header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.fc-sort-select {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  color: var(--text-dim);
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 5px 8px;
  cursor: pointer;
  outline: none;
}

.fc-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 14px;
  background: rgba(212,160,23,0.1);
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background 0.2s;
}
.fc-btn:hover { background: rgba(212,160,23,0.2); }
.fc-btn svg { width: 13px; height: 13px; }

.fc-btn-ghost {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}
.fc-btn-ghost:hover { border-color: var(--gold-dim); color: var(--gold-dim); }
.fc-btn-ghost.danger:hover { border-color: var(--red); color: var(--red); }

/* File list */
.fc-file-list {
  padding: 0 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.fc-file {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}
.fc-file:hover { background: var(--bg-hover); border-color: var(--border-light); }
.fc-file.active { border-color: var(--gold-muted); }
.fc-file.pinned { border-left: 2px solid var(--gold-dim); }

.fc-file-info { min-width: 0; }

.fc-file-title-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.fc-file-pin {
  font-size: 11px;
  color: var(--gold-dim);
  flex-shrink: 0;
}

.fc-file-name {
  font-weight: 500;
  font-size: 13px;
  color: var(--text-bright);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fc-file-meta {
  display: flex;
  gap: 10px;
  margin-top: 2px;
  font-size: 11px;
  color: var(--text-dim);
}

.fc-file-snippet {
  margin-top: 4px;
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.fc-file-snippet mark {
  background: rgba(212,160,23,0.25);
  color: var(--gold-bright);
  padding: 0 2px;
}

.fc-file-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  flex-shrink: 0;
}

.fc-tag {
  font-size: 10px;
  font-family: 'Cinzel', serif;
  letter-spacing: 0.5px;
  padding: 2px 7px;
  border: 1px solid var(--border);
  color: var(--text-dim);
  white-space: nowrap;
}

.fc-file-date {
  font-family: 'Jersey 15', monospace;
  font-size: 13px;
  color: var(--text-dim);
  white-space: nowrap;
  flex-shrink: 0;
}

.fc-result-folder {
  font-size: 10px;
  font-family: 'Cinzel', serif;
  letter-spacing: 0.5px;
  color: var(--gold-dim);
  background: rgba(212,160,23,0.06);
  padding: 2px 7px;
  border: 1px solid var(--gold-muted);
  white-space: nowrap;
}

/* Expanded file view */
.fc-expanded {
  margin: 0 20px 4px;
  padding: 20px;
  background: var(--bg-card);
  border: 1px solid var(--gold-muted);
}

.fc-expanded-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.fc-expanded-title {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 17px;
  color: var(--gold);
  letter-spacing: 0.5px;
}

.fc-expanded-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.fc-expanded-meta {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 14px;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}

.fc-expanded-body {
  font-size: 13px;
  line-height: 1.7;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}

.fc-expanded-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 14px;
}

/* Collapsible body wrapper */
.fc-body-wrap {
  position: relative;
  max-height: 250px;
  overflow: hidden;
}
.fc-body-wrap.expanded { max-height: none; }
.fc-body-wrap:not(.expanded)::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: linear-gradient(transparent, var(--bg-card));
  pointer-events: none;
}
.fc-body-toggle {
  display: block;
  width: 100%;
  text-align: center;
  padding: 10px;
  background: none;
  border: 1px solid var(--border);
  color: var(--gold-dim);
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 1px;
  cursor: pointer;
  margin-top: 6px;
  transition: border-color 0.2s, color 0.2s;
}
.fc-body-toggle:hover { border-color: var(--gold-dim); color: var(--gold); }

/* Comments section */
.fc-comments {
  margin-top: 18px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}

.fc-comments-title {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.fc-comment {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.fc-comment:last-of-type { border-bottom: none; }

.fc-comment-head {
  display: flex;
  gap: 10px;
  margin-bottom: 4px;
  font-size: 11px;
}

.fc-comment-author {
  color: var(--gold-dim);
  font-weight: 500;
}

.fc-comment-date {
  color: var(--text-dim);
}

.fc-comment-text {
  color: var(--text);
  line-height: 1.5;
}

.fc-comment-form {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.fc-comment-input {
  flex: 1;
  padding: 8px 10px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  outline: none;
  transition: border-color 0.2s;
}
.fc-comment-input:focus { border-color: var(--gold-dim); }
.fc-comment-input::placeholder { color: var(--text-dim); }

/* Version history */
.fc-versions {
  margin-top: 14px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}

.fc-version {
  padding: 6px 0;
  font-size: 12px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: color 0.15s;
}
.fc-version:hover { color: var(--text); }
.fc-version:last-child { border-bottom: none; }

/* Search results header */
.fc-search-results-head {
  padding: 14px 20px 6px;
  font-family: 'Cinzel', serif;
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 1px;
}
.fc-search-results-head strong { color: var(--gold); }

/* Activity log */
.fc-activity-item {
  padding: 8px 20px;
  font-size: 12px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: baseline;
}
.fc-activity-actor { color: var(--gold-dim); font-weight: 500; }
.fc-activity-time {
  font-family: 'Jersey 15', monospace;
  font-size: 12px;
  margin-left: auto;
  flex-shrink: 0;
}

/* Trash view */
.fc-trash-head {
  padding: 16px 20px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.fc-trash-title {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--red);
  letter-spacing: 1px;
}
.fc-trash-note {
  font-size: 11px;
  color: var(--text-dim);
  padding: 0 20px 10px;
}

/* Empty state */
.fc-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  text-align: center;
}
.fc-empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
.fc-empty-text {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.fc-empty-sub { font-size: 12px; color: var(--text-dim); opacity: 0.6; }

/* Modal */
.fc-modal-bg {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.fc-modal {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  max-width: 520px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
}

.fc-modal-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.fc-modal-title {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 15px;
  color: var(--gold);
  letter-spacing: 1px;
}

.fc-modal-close {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
}
.fc-modal-close:hover { color: var(--text); }

.fc-modal-body { padding: 20px; }

.fc-field {
  margin-bottom: 14px;
}

.fc-label {
  display: block;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-bottom: 5px;
  font-family: 'Cinzel', serif;
}

.fc-input {
  width: 100%;
  padding: 9px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.fc-input:focus { border-color: var(--gold-dim); }

.fc-textarea {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  outline: none;
  resize: vertical;
  min-height: 120px;
  line-height: 1.6;
  transition: border-color 0.2s;
}
.fc-textarea:focus { border-color: var(--gold-dim); }

.fc-modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex;

/* Toast */

  z-index: 200;

}

/* Footer */
.fc-footer {
  padding: 16px 20px;
  text-align: center;
  font-size: 11px;

@media (max-width: 768px) {
  .fc-layout { grid-template-columns: 1fr; }

  .fc-sidebar-head { display: none; }
  .fc-mob-current {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 12px;
    padding: 10px 14px;

  }
  .fc-mob-current.open { border-color: var(--gold-muted); border-radius: 4px 4px 0 0; margin-bottom: 0; }
  .fc-mob-current-emoji { font-size: 16px; }
  .fc-mob-current-name {
    font-family: 'Cinzel', serif;

    color: var(--text);

  }
  .fc-mob-actions {
    display: flex;

  }
  .fc-mob-actions .fc-sidebar-btn {

  }

    color: var(--gold-dim);
    transition: transform 0.2s;
  }
  .fc-mob-current.open .fc-mob-chevron { transform: rotate(180deg); }
  .fc-folder-list {
    display: none;
    flex-direction: column;
    padding: 0;
    margin: 0 12px 8px;
    background: var(--bg-card);
    border: 1px solid var(--gold-muted);
    border-top: none;
    border-radius: 0 0 4px 4px;
  }
  .fc-folder-list.mob-open { display: flex; }
  .fc-folder {
    padding: 8px 14px;
    border-left: 3px solid transparent;
    gap: 8px;
  }
  .fc-folder.active { border-left-color: var(--gold); background: rgba(212,160,23,0.06); }
  .fc-folder-emoji { font-size: 14px; width: 20px; }
  .fc-folder-name { font-size: 11px; }
  .fc-folder-count { font-size: 11px; }
  .fc-sidebar-foot { display: none; }
  .fc-search-bar { padding: 8px 12px; gap: 6px; position: sticky; top: 0; z-index: 5; }
  .fc-search-input { padding: 7px 8px 7px 30px; font-size: 12px; }
  .fc-scope-btn { font-size: 9px; padding: 5px 7px; }
  .fc-folder-header { padding: 10px 12px 8px; }
  .fc-folder-header-emoji { font-size: 20px; }
  .fc-folder-header-name { font-size: 15px; }
  .fc-folder-header-desc { padding-left: 32px; font-size: 11px; }
  .fc-sort-select { font-size: 10px; }
  .fc-btn { padding: 6px 10px; font-size: 10px; }
  .fc-file-list { padding: 0 12px 16px; gap: 4px; }
  .fc-file { grid-template-columns: 1fr auto; padding: 10px 12px; gap: 8px; }
  .fc-file-tags { display: none; }
  .fc-file-name { font-size: 12px; }
  .fc-file-meta { font-size: 10px; gap: 6px; }
  .fc-file-snippet { font-size: 11px; }
  .fc-expanded { margin: 0 12px 4px; padding: 14px; }
  .fc-expanded-title { font-size: 14px; }
  .fc-expanded-body { font-size: 12px; }

  .arm-brand img { width: 24px; height: 24px; }
  .arm-brand span { font-size: 12px; letter-spacing: 1.5px; }
  .arm-links { display: none; }
}
</style>
</head>
<body>

<!-- Lock screen -->
<div class="lock-overlay" id="lockOverlay">
  <div class="lock-box">
    <div class="lock-icon">&#128274;</div>
    <div class="lock-title">FILE CABINET</div>
    <div class="lock-sub">Leader access required</div>
    <input class="lock-input" type="password" id="lockInput" placeholder="Enter access code" autocomplete="off">
    <button class="lock-btn" id="lockBtn">UNLOCK</button>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-back"><a href="/armoury.html">Back to The Armoury</a></div>
  </div>
</div>

<!-- Main app (hidden until unlocked) -->
<div id="appWrap" style="display:none;">

<!-- Nav -->
<nav class="arm-nav">
  <a class="arm-brand" href="/armoury.html">
    <img src="/assets/crest.png" alt="Multi-Misfits" width="28" height="28">
    <span>THE ARMOURY</span>
  </a>
  <div class="arm-links">
    <a href="/ideaboard.html">Idea Board</a>
    <a href="/eventforge.html">EventForge</a>
    <a href="/filecabinet.html" class="active">File Cabinet</a>
  </div>
  <div class="arm-user" id="userName" title="Click to change name"></div>
</nav>

<div class="fc-layout">
  <!-- Sidebar -->
  <aside class="fc-sidebar">
    <div class="fc-sidebar-head">
      <div class="fc-sidebar-title">Folders</div>
      <div class="fc-sidebar-actions">
        <button class="fc-sidebar-btn" id="trashBtn" title="Trash">&#128465;</button>
        <button class="fc-sidebar-btn" id="activityBtn" title="Activity log">&#128240;</button>
      </div>
    </div>
    <div class="fc-mob-current" id="mobFolderToggle">
      <span class="fc-mob-current-name">Folders</span>
      <span class="fc-mob-actions">
        <button class="fc-sidebar-btn" id="mobTrashBtn" title="Trash">&#128465;</button>
        <button class="fc-sidebar-btn" id="mobActivityBtn" title="Activity">&#128240;</button>
      </span>
      <span class="fc-mob-chevron">&#9660;</span>
    </div>
    <div class="fc-folder-list" id="folderList"></div>
    <div class="fc-sidebar-foot">
      <button class="fc-add-folder-btn" id="addFolderBtn">+ New Folder</button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="fc-main" id="mainContent"></main>
</div>

</div>

<!-- Toast -->
<div class="fc-toast" id="toast"></div>

<!-- Modal container -->
<div id="modalWrap"></div>

<script>
(function(){
"use strict";

var API = "/api/filecabinet";
var CODE_KEY = "mm-filecabinet-code";
var USER_KEY = "mm-filecabinet-user";
var STARS_KEY = "mm-filecabinet-stars";

var state = {
  code: "",
  user: "",
  folders: [],
  currentFolder: null,
  files: [],
  expandedFile: null,
  expandedData: null,
  view: "folder",
  sort: "newest",
  searchScope: "all",
  searchQuery: "",
  searchResults: [],
  trashFiles: [],
  activityItems: [],
  stars: {},
};

// ── Helpers ──

function esc(s) {
  if (!s) return "";
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function formatDate(iso) {
  if (!iso) return "";
  var d = new Date(iso + (iso.includes("Z") ? "" : "Z"));
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return months[d.getMonth()] + " " + d.getDate();
}

function formatDateFull(iso) {
  if (!iso) return "";
  var d = new Date(iso + (iso.includes("Z") ? "" : "Z"));
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
}

function timeAgo(iso) {
  if (!iso) return "";
  var d = new Date(iso + (iso.includes("Z") ? "" : "Z"));
  var now = Date.now();
  var diff = now - d.getTime();
  var mins = Math.floor(diff / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  var days = Math.floor(hrs / 24);
  if (days < 30) return days + "d ago";
  return formatDate(iso);
}

function toast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove("show"); }, 2500);
}

function loadStars() {
  try { state.stars = JSON.parse(localStorage.getItem(STARS_KEY) || "{}"); } catch(_) { state.stars = {}; }
}

function saveStars() {
  try { localStorage.setItem(STARS_KEY, JSON.stringify(state.stars)); } catch(_) {}
}

async function api(method, params) {
  var url = API;
  if (method === "GET") {
    var qs = new URLSearchParams(params).toString();
    if (qs) url += "?" + qs;
    var res = await fetch(url);
    return res.json();
  }
  if (!params.access_code) params.access_code = state.code;
  if (!params.actor) params.actor = state.user;
  var res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(params),
  });
  return res.json();
}

// ── Auth ──

function ensureUser() {
  if (state.user) return true;
  var name = prompt("Enter your name (for filing attribution):");
  if (!name || !name.trim()) return false;
  state.user = name.trim();
  try { localStorage.setItem(USER_KEY, state.user); } catch(_) {}
  updateUserDisplay();
  return true;
}

function updateUserDisplay() {
  var el = document.getElementById("userName");
  if (el) el.textContent = state.user ? state.user : "";
}

async function tryUnlock(code) {
  var res = await api("POST", { action: "validate", access_code: code });
  return res.valid;
}

async function initAuth() {
  var saved = "";
  try { saved = localStorage.getItem(CODE_KEY) || ""; } catch(_) {}
  if (saved) {
    var valid = await tryUnlock(saved);
    if (valid) {
      state.code = saved;
      unlock();
      return;
    }
    try { localStorage.removeItem(CODE_KEY); } catch(_) {}
  }

  document.getElementById("lockOverlay").style.display = "flex";

  document.getElementById("lockBtn").onclick = async function() {
    var input = document.getElementById("lockInput");
    var code = input.value.trim();
    if (!code) return;
    var valid = await tryUnlock(code);
    if (valid) {
      state.code = code;
      try { localStorage.setItem(CODE_KEY, code); } catch(_) {}
      unlock();
    } else {
      document.getElementById("lockError").textContent = "Invalid code";
      input.value = "";
      input.focus();
    }
  };

  document.getElementById("lockInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") document.getElementById("lockBtn").click();
  });
}

function unlock() {
  document.getElementById("lockOverlay").style.display = "none";
  document.getElementById("appWrap").style.display = "block";
  try { state.user = localStorage.getItem(USER_KEY) || ""; } catch(_) {}
  loadStars();
  updateUserDisplay();
  loadFolders();
}

// ── Data loading ──

async function loadFolders() {
  var data = await api("GET", {});
  state.folders = data.folders || [];
  renderSidebar();
  if (!state.currentFolder && state.folders.length) {
    selectFolder(state.folders[0].id);
  }
}

async function loadFiles(folderId) {
  var data = await api("GET", { folder: folderId, sort: state.sort });
  state.files = data.files || [];
  state.expandedFile = null;
  state.expandedData = null;
  renderMain();
}

async function loadFile(fileId) {
  var data = await api("GET", { file: fileId });
  state.expandedFile = fileId;
  state.expandedData = data;
  renderMain();
}

async function loadSearch(query) {
  var params = { search: query };
  if (state.searchScope !== "all" && state.currentFolder) params.folder = state.currentFolder;
  var data = await api("GET", params);
  state.searchResults = data.results || [];
  state.searchQuery = data.query || query;
  renderMain();
}

async function loadTrash() {
  var data = await api("GET", { trash: "1" });
  state.trashFiles = data.files || [];
  renderMain();
}

async function loadActivity() {
  var data = await api("GET", { activity: "1" });
  state.activityItems = data.activity || [];
  renderMain();
}

async function loadVersions(fileId) {
  var data = await api("GET", { versions: fileId });
  return data.versions || [];
}

// ── Folder selection ──

function selectFolder(folderId) {
  state.currentFolder = folderId;
  state.view = "folder";
  state.expandedFile = null;
  state.expandedData = null;
  state.searchQuery = "";
  renderSidebar();
  loadFiles(folderId);
  var searchEl = document.querySelector(".fc-search-input");
  if (searchEl) searchEl.value = "";
}

// ── Render: Sidebar ──

function renderSidebar() {
  var list = document.getElementById("folderList");
  var html = "";
  for (var i = 0; i < state.folders.length; i++) {
    var f = state.folders[i];
    var active = (state.view === "folder" && f.id === state.currentFolder) ? " active" : "";
    html += '<div class="fc-folder' + active + '" data-id="' + esc(f.id) + '">'
      + '<span class="fc-folder-emoji">' + esc(f.emoji) + '</span>'
      + '<span class="fc-folder-name">' + esc(f.name) + '</span>'
      + '<span class="fc-folder-count">' + (f.file_count || 0) + '</span>'
      + '</div>';
  }
  list.innerHTML = html;

  list.querySelectorAll(".fc-folder").forEach(function(el) {
    el.onclick = function() {
      selectFolder(el.dataset.id);
      closeMobFolders();
    };
  });

  document.getElementById("trashBtn").className = "fc-sidebar-btn" + (state.view === "trash" ? " active" : "");
  document.getElementById("activityBtn").className = "fc-sidebar-btn" + (state.view === "activity" ? " active" : "");
}

function closeMobFolders() {
  document.getElementById("folderList").classList.remove("mob-open");
  document.getElementById("mobFolderToggle").classList.remove("open");
}

// ── Render: Main content ──

function renderMain() {
  var main = document.getElementById("mainContent");

  if (state.view === "trash") { renderTrash(main); return; }
  if (state.view === "activity") { renderActivity(main); return; }
  if (state.view === "search") { renderSearchResults(main); return; }

  renderFolderView(main);
}

function renderFolderView(main) {
  var folder = state.folders.find(function(f){ return f.id === state.currentFolder; });
  if (!folder) { main.innerHTML = '<div class="fc-empty"><div class="fc-empty-icon">&#128194;</div><div class="fc-empty-text">Select a folder</div></div>'; return; }

  var html = renderSearchBar();

  html += '<div class="fc-folder-header">'
    + '<div class="fc-folder-header-left">'
    + '<span class="fc-folder-header-emoji">' + esc(folder.emoji) + '</span>'
    + '<span class="fc-folder-header-name">' + esc(folder.name) + '</span>'
    + '<span class="fc-folder-header-count">(' + state.files.length + ')</span>'
    + '</div>'
    + '<div class="fc-header-actions">'
    + '<select class="fc-sort-select" id="sortSelect">'
    + '<option value="newest"' + (state.sort==="newest"?" selected":"") + '>Newest</option>'
    + '<option value="oldest"' + (state.sort==="oldest"?" selected":"") + '>Oldest</option>'
    + '<option value="alpha"' + (state.sort==="alpha"?" selected":"") + '>A-Z</option>'
    + '<option value="edited"' + (state.sort==="edited"?" selected":"") + '>Last edited</option>'
    + '</select>'
    + '<button class="fc-btn" id="newFileBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> New File</button>'
    + '</div></div>';

  if (folder.description) {
    html += '<div class="fc-folder-header-desc">' + esc(folder.description) + '</div>';
  }

  if (state.files.length === 0) {
    html += '<div class="fc-empty"><div class="fc-empty-icon">&#128196;</div><div class="fc-empty-text">No files yet</div><div class="fc-empty-sub">Click "New File" to add one</div></div>';
  } else {
    html += '<div class="fc-file-list">';
    for (var i = 0; i < state.files.length; i++) {
      html += renderFileRow(state.files[i], false);
      if (state.expandedFile === state.files[i].id && state.expandedData) {
        html += renderExpandedFile();
      }
    }
    html += '</div>';
  }

  html += renderFooter();
  main.innerHTML = html;
  bindMainEvents();
}

function renderSearchResults(main) {
  var html = renderSearchBar();
  html += '<div class="fc-search-results-head">Results for "<strong>' + esc(state.searchQuery) + '</strong>" &mdash; ' + state.searchResults.length + ' found</div>';

  if (state.searchResults.length === 0) {
    html += '<div class="fc-empty"><div class="fc-empty-icon">&#128269;</div><div class="fc-empty-text">No results</div><div class="fc-empty-sub">Try different keywords</div></div>';
  } else {
    html += '<div class="fc-file-list">';
    for (var i = 0; i < state.searchResults.length; i++) {
      html += renderFileRow(state.searchResults[i], true);
      if (state.expandedFile === state.searchResults[i].id && state.expandedData) {
        html += renderExpandedFile();
      }
    }
    html += '</div>';
  }

  html += renderFooter();
  main.innerHTML = html;
  bindMainEvents();
}

function renderTrash(main) {
  var html = '<div class="fc-trash-head">'
    + '<div class="fc-trash-title">&#128465; Trash</div>'
    + '<button class="fc-btn-ghost danger" id="emptyTrashBtn">Empty Trash</button>'
    + '</div>'
    + '<div class="fc-trash-note">Files are permanently deleted after 15 days.</div>';

  if (state.trashFiles.length === 0) {
    html += '<div class="fc-empty"><div class="fc-empty-icon">&#128465;</div><div class="fc-empty-text">Trash is empty</div></div>';
  } else {
    html += '<div class="fc-file-list">';
    for (var i = 0; i < state.trashFiles.length; i++) {
      var f = state.trashFiles[i];
      html += '<div class="fc-file" data-id="' + esc(f.id) + '" data-trash="1">'
        + '<div class="fc-file-info">'
        + '<div class="fc-file-name">' + esc(f.title) + '</div>'
        + '<div class="fc-file-meta"><span>from ' + esc(f.folder_name || "") + '</span><span>by ' + esc(f.filed_by) + '</span></div>'
        + '</div>'
        + '<div class="fc-file-date">' + formatDate(f.trashed_at) + '</div>'
        + '</div>';
    }
    html += '</div>';
  }

  html += renderFooter();
  main.innerHTML = html;

  main.querySelectorAll(".fc-file[data-trash]").forEach(function(el) {
    el.onclick = function() {
      if (confirm("Restore this file?")) {
        api("POST", { action: "restore_file", id: el.dataset.id }).then(function(r) {
          if (r.ok) { toast("File restored"); loadTrash(); loadFolders(); }
        });
      }
    };
  });

  var emptyBtn = document.getElementById("emptyTrashBtn");
  if (emptyBtn) {
    emptyBtn.onclick = function() {
      if (confirm("Permanently delete all trashed files? This cannot be undone.")) {
        api("POST", { action: "empty_trash" }).then(function(r) {
          if (r.ok) { toast("Trash emptied"); loadTrash(); }
        });
      }
    };
  }
}

function renderActivity(main) {
  var html = '<div class="fc-folder-header"><div class="fc-folder-header-left">'
    + '<span class="fc-folder-header-emoji">&#128240;</span>'
    + '<span class="fc-folder-header-name">Activity Log</span>'
    + '</div></div>';

  if (state.activityItems.length === 0) {
    html += '<div class="fc-empty"><div class="fc-empty-icon">&#128240;</div><div class="fc-empty-text">No activity yet</div></div>';
  } else {
    for (var i = 0; i < state.activityItems.length; i++) {
      var a = state.activityItems[i];
      html += '<div class="fc-activity-item">'
        + '<span class="fc-activity-actor">' + esc(a.actor) + '</span> '
        + esc(a.action) + ' '
        + (a.target_name ? '<strong>' + esc(a.target_name) + '</strong>' : '')
        + (a.details ? ' ' + esc(a.details) : '')
        + '<span class="fc-activity-time">' + timeAgo(a.created_at) + '</span>'
        + '</div>';
    }
  }

  html += renderFooter();
  main.innerHTML = html;
}

function renderFileRow(f, showFolder) {
  var isActive = state.expandedFile === f.id ? " active" : "";
  var isPinned = f.pinned ? " pinned" : "";
  var isStarred = state.stars[f.id];
  var tags = f.tags || [];

  var html = '<div class="fc-file' + isActive + isPinned + '" data-id="' + esc(f.id) + '">'
    + '<div class="fc-file-info">'
    + '<div class="fc-file-title-row">';

  if (f.pinned) html += '<span class="fc-file-pin" title="Pinned">&#128204;</span>';
  if (isStarred) html += '<span class="fc-file-pin" title="Starred">&#11088;</span>';
  html += '<span class="fc-file-name">' + esc(f.title) + '</span></div>';

  html += '<div class="fc-file-meta">'
    + '<span>by ' + esc(f.filed_by) + '</span>'
    + '</div>';

  if (f.snippet) {
    var snippet = esc(f.snippet);
    if (state.searchQuery) {
      var re = new RegExp("(" + state.searchQuery.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
      snippet = snippet.replace(re, "<mark>$1</mark>");
    }
    html += '<div class="fc-file-snippet">' + snippet + '</div>';
  }
  html += '</div>';

  if (showFolder && f.folder_name) {
    html += '<span class="fc-result-folder">' + esc(f.folder_emoji || "") + ' ' + esc(f.folder_name) + '</span>';
  } else if (tags.length) {
    html += '<div class="fc-file-tags">';
    for (var t = 0; t < tags.length; t++) html += '<span class="fc-tag">' + esc(tags[t]) + '</span>';
    html += '</div>';
  }

  html += '<div class="fc-file-date">' + formatDate(f.updated_at || f.created_at) + '</div>'
    + '</div>';

  return html;
}

function renderExpandedFile() {
  var d = state.expandedData;
  if (!d || !d.file) return "";
  var f = d.file;
  var comments = d.comments || [];
  var vCount = d.versionCount || 0;
  var isStarred = state.stars[f.id];
  var tags = f.tags || [];

  var html = '<div class="fc-expanded">'
    + '<div class="fc-expanded-head">'
    + '<div class="fc-expanded-title">' + esc(f.title) + '</div>'
    + '<div class="fc-expanded-actions">'
    + '<button class="fc-btn-ghost" data-act="star">' + (isStarred ? '&#11088; Starred' : '&#9734; Star') + '</button>'
    + '<button class="fc-btn-ghost" data-act="pin">' + (f.pinned ? 'Unpin' : 'Pin') + '</button>'
    + '<button class="fc-btn-ghost" data-act="edit">Edit</button>'
    + '<button class="fc-btn-ghost" data-act="move">Move</button>'
    + '<button class="fc-btn-ghost" data-act="duplicate">Duplicate</button>'
    + '<button class="fc-btn-ghost" data-act="link">&#128279; Link</button>'
    + '<button class="fc-btn-ghost" data-act="export">Export</button>'
    + (vCount > 0 ? '<button class="fc-btn-ghost" data-act="versions">' + vCount + ' version' + (vCount > 1 ? 's' : '') + '</button>' : '')
    + '<button class="fc-btn-ghost danger" data-act="trash">Delete</button>'
    + '</div></div>'
    + '<div class="fc-expanded-meta">'
    + '<span>Filed by ' + esc(f.filed_by) + '</span>'
    + '<span>Created ' + formatDateFull(f.created_at) + '</span>'
    + '<span>Updated ' + formatDateFull(f.updated_at) + '</span>'
    + '</div>';

  if (tags.length) {
    html += '<div class="fc-expanded-tags">';
    for (var t = 0; t < tags.length; t++) html += '<span class="fc-tag">' + esc(tags[t]) + '</span>';
    html += '</div>';
  }

  html += '<div class="fc-body-wrap" id="bodyWrap">'
    + '<div class="fc-expanded-body">' + esc(f.content || "(empty)") + '</div>'
    + '</div>'
    + '<button class="fc-body-toggle" id="bodyToggle" style="display:none;">Show more</button>';

  // Comments
  html += '<div class="fc-comments">'
    + '<div class="fc-comments-title">Discussion (' + comments.length + ')</div>';
  for (var c = 0; c < comments.length; c++) {
    html += '<div class="fc-comment">'
      + '<div class="fc-comment-head">'
      + '<span class="fc-comment-author">' + esc(comments[c].author) + '</span>'
      + '<span class="fc-comment-date">' + timeAgo(comments[c].created_at) + '</span>'
      + '</div>'
      + '<div class="fc-comment-text">' + esc(comments[c].text) + '</div>'
      + '</div>';
  }
  html += '<div class="fc-comment-form">'
    + '<input class="fc-comment-input" id="commentInput" placeholder="Add a comment...">'
    + '<button class="fc-btn-ghost" id="commentBtn">Post</button>'
    + '</div></div>';

  html += '</div>';
  return html;
}

function renderSearchBar() {
  var scopeLabel = state.searchScope === "all" ? "All Folders" : "This Folder";
  var scopeClass = state.searchScope === "all" ? " all" : "";
  return '<div class="fc-search-bar">'
    + '<div class="fc-search-wrap">'
    + '<svg class="fc-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>'
    + '<input class="fc-search-input" type="text" placeholder="Search files, content, tags..." value="' + esc(state.searchQuery) + '" id="searchInput">'
    + '</div>'
    + '<button class="fc-scope-btn' + scopeClass + '" id="scopeBtn">' + scopeLabel + '</button>'
    + '</div>';
}

function renderFooter() {
  return '<div class="fc-footer"><a href="/armoury.html">The Armoury</a> &middot; <a href="/">Main Site</a></div>'
    + '<div class="disclaimer">Multi-Misfits is a player-run fan community and is not affiliated with, endorsed by, or sponsored by Jagex Ltd.<br>RuneScape and Old School RuneScape are trademarks of Jagex Ltd.</div>';
}

// ── Bind events ──

function bindMainEvents() {
  // Search
  var searchEl = document.getElementById("searchInput");
  if (searchEl) {
    var searchTimer;
    searchEl.oninput = function() {
      clearTimeout(searchTimer);
      var q = searchEl.value.trim();
      if (q.length >= 2) {
        searchTimer = setTimeout(function() {
          state.view = "search";
          loadSearch(q);
        }, 300);
      } else if (q.length === 0 && state.view === "search") {
        state.view = "folder";
        state.searchQuery = "";
        if (state.currentFolder) loadFiles(state.currentFolder);
      }
    };
  }

  // Scope toggle
  var scopeBtn = document.getElementById("scopeBtn");
  if (scopeBtn) {
    scopeBtn.onclick = function() {
      state.searchScope = state.searchScope === "all" ? "folder" : "all";
      if (state.searchQuery) loadSearch(state.searchQuery);
      else renderMain();
    };
  }

  // Sort
  var sortEl = document.getElementById("sortSelect");
  if (sortEl) {
    sortEl.onchange = function() {
      state.sort = sortEl.value;
      if (state.currentFolder) loadFiles(state.currentFolder);
    };
  }

  // New file
  var newBtn = document.getElementById("newFileBtn");
  if (newBtn) {
    newBtn.onclick = function() { showFileModal(); };
  }

  // File rows
  document.querySelectorAll(".fc-file:not([data-trash])").forEach(function(el) {
    el.onclick = function() {
      if (state.expandedFile === el.dataset.id) {
        state.expandedFile = null;
        state.expandedData = null;
        renderMain();
      } else {
        loadFile(el.dataset.id);
      }
    };
  });

  // Expanded file actions
  document.querySelectorAll("[data-act]").forEach(function(btn) {
    btn.onclick = function(e) {
      e.stopPropagation();
      handleFileAction(btn.dataset.act);
    };
  });

  // Collapsible body
  var bodyWrap = document.getElementById("bodyWrap");
  var bodyToggle = document.getElementById("bodyToggle");
  if (bodyWrap && bodyToggle) {
    var bodyEl = bodyWrap.querySelector(".fc-expanded-body");
    if (bodyEl && bodyEl.scrollHeight > 260) {
      bodyToggle.style.display = "block";
    } else {
      bodyWrap.classList.add("expanded");
    }
    bodyToggle.onclick = function(e) {
      e.stopPropagation();
      bodyWrap.classList.toggle("expanded");
      bodyToggle.textContent = bodyWrap.classList.contains("expanded") ? "Show less" : "Show more";
    };
  }

  // Comment
  var commentBtn = document.getElementById("commentBtn");
  if (commentBtn) {
    commentBtn.onclick = function() {
      if (!ensureUser()) return;
      var input = document.getElementById("commentInput");
      var text = input.value.trim();
      if (!text) return;
      api("POST", { action: "add_comment", file_id: state.expandedFile, author: state.user, text: text }).then(function(r) {
        if (r.ok) { toast("Comment added"); loadFile(state.expandedFile); }
      });
    };
    var commentInput = document.getElementById("commentInput");
    if (commentInput) {
      commentInput.onkeydown = function(e) { if (e.key === "Enter") commentBtn.click(); };
    }
  }
}

// ── File actions ──

function handleFileAction(act) {
  if (!state.expandedFile || !state.expandedData) return;
  var f = state.expandedData.file;

  if (act === "star") {
    if (state.stars[f.id]) delete state.stars[f.id];
    else state.stars[f.id] = true;
    saveStars();
    loadFile(f.id);
    return;
  }

  if (act === "pin") {
    api("POST", { action: "pin_file", id: f.id, pinned: !f.pinned }).then(function(r) {
      if (r.ok) { toast(f.pinned ? "Unpinned" : "Pinned"); refreshAfterChange(); }
    });
    return;
  }

  if (act === "edit") {
    showFileModal(f);
    return;
  }

  if (act === "move") {
    showMoveModal(f);
    return;
  }

  if (act === "duplicate") {
    if (!ensureUser()) return;
    api("POST", { action: "duplicate_file", id: f.id }).then(function(r) {
      if (r.ok) { toast("File duplicated"); refreshAfterChange(); }
    });
    return;
  }

  if (act === "link") {
    var link = location.origin + "/filecabinet.html#file=" + f.id;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(link).then(function() { toast("Link copied"); });
    } else {
      prompt("Copy this link:", link);
    }
    return;
  }

  if (act === "export") {
    var blob = new Blob([f.content || ""], { type: "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = (f.title || "file") + ".txt";
    a.click();
    URL.revokeObjectURL(url);
    toast("File exported");
    return;
  }

  if (act === "versions") {
    showVersionsModal(f.id);
    return;
  }

  if (act === "trash") {
    if (!confirm("Move this file to trash?")) return;
    api("POST", { action: "trash_file", id: f.id }).then(function(r) {
      if (r.ok) { toast("Moved to trash"); state.expandedFile = null; refreshAfterChange(); }
    });
    return;
  }
}

function refreshAfterChange() {
  loadFolders();
  if (state.currentFolder) loadFiles(state.currentFolder);
}

// ── Modals ──

function closeModal() {
  document.getElementById("modalWrap").innerHTML = "";
}

function showFileModal(existing) {
  if (!ensureUser()) return;
  var isEdit = !!existing;
  var title = isEdit ? "Edit File" : "New File";
  var tags = (existing && existing.tags) ? existing.tags.join(", ") : "";

  var html = '<div class="fc-modal-bg" id="modalBg">'
    + '<div class="fc-modal">'
    + '<div class="fc-modal-head"><div class="fc-modal-title">' + title + '</div><button class="fc-modal-close" id="modalClose">&times;</button></div>'
    + '<div class="fc-modal-body">'
    + '<div class="fc-field"><label class="fc-label">Title</label><input class="fc-input" id="mTitle" value="' + esc(existing ? existing.title : "") + '"></div>'
    + '<div class="fc-field"><label class="fc-label">Content</label><textarea class="fc-textarea" id="mContent">' + esc(existing ? existing.content : "") + '</textarea></div>'
    + '<div class="fc-field"><label class="fc-label">Tags (comma separated)</label><input class="fc-input" id="mTags" value="' + esc(tags) + '" placeholder="e.g. rules, important"></div>'
    + '</div>'
    + '<div class="fc-modal-footer">'
    + '<button class="fc-btn-ghost" id="mCancel">Cancel</button>'
    + '<button class="fc-btn" id="mSave">' + (isEdit ? 'Save Changes' : 'Create File') + '</button>'
    + '</div></div></div>';

  document.getElementById("modalWrap").innerHTML = html;

  document.getElementById("modalClose").onclick = closeModal;
  document.getElementById("mCancel").onclick = closeModal;
  document.getElementById("modalBg").onclick = function(e) { if (e.target === this) closeModal(); };

  document.getElementById("mSave").onclick = async function() {
    var t = document.getElementById("mTitle").value.trim();
    if (!t) { toast("Title is required"); return; }
    var content = document.getElementById("mContent").value;
    var tagsStr = document.getElementById("mTags").value;
    var tagsArr = tagsStr ? tagsStr.split(",").map(function(s){ return s.trim(); }).filter(Boolean) : [];

    if (isEdit) {
      var r = await api("POST", { action: "update_file", id: existing.id, title: t, content: content, tags: tagsArr, edited_by: state.user });
      if (r.ok) { toast("File updated"); closeModal(); refreshAfterChange(); loadFile(existing.id); }
    } else {
      var r = await api("POST", { action: "create_file", folder_id: state.currentFolder, title: t, content: content, tags: tagsArr, filed_by: state.user });
      if (r.ok) { toast("File created"); closeModal(); refreshAfterChange(); }
    }
  };

  document.getElementById("mTitle").focus();
}

function showMoveModal(file) {
  var html = '<div class="fc-modal-bg" id="modalBg">'
    + '<div class="fc-modal">'
    + '<div class="fc-modal-head"><div class="fc-modal-title">Move File</div><button class="fc-modal-close" id="modalClose">&times;</button></div>'
    + '<div class="fc-modal-body">'
    + '<div class="fc-field"><label class="fc-label">Move "' + esc(file.title) + '" to:</label>'
    + '<select class="fc-input" id="mFolder">';

  for (var i = 0; i < state.folders.length; i++) {
    var f = state.folders[i];
    if (f.id === file.folder_id) continue;
    html += '<option value="' + esc(f.id) + '">' + esc(f.emoji) + ' ' + esc(f.name) + '</option>';
  }

  html += '</select></div></div>'
    + '<div class="fc-modal-footer">'
    + '<button class="fc-btn-ghost" id="mCancel">Cancel</button>'
    + '<button class="fc-btn" id="mSave">Move</button>'
    + '</div></div></div>';

  document.getElementById("modalWrap").innerHTML = html;

  document.getElementById("modalClose").onclick = closeModal;
  document.getElementById("mCancel").onclick = closeModal;
  document.getElementById("modalBg").onclick = function(e) { if (e.target === this) closeModal(); };

  document.getElementById("mSave").onclick = async function() {
    var targetId = document.getElementById("mFolder").value;
    if (!ensureUser()) return;
    var r = await api("POST", { action: "move_file", id: file.id, folder_id: targetId });
    if (r.ok) { toast("File moved"); closeModal(); state.expandedFile = null; refreshAfterChange(); }
  };
}

function showFolderModal() {
  if (!ensureUser()) return;
  var html = '<div class="fc-modal-bg" id="modalBg">'
    + '<div class="fc-modal">'
    + '<div class="fc-modal-head"><div class="fc-modal-title">New Folder</div><button class="fc-modal-close" id="modalClose">&times;</button></div>'
    + '<div class="fc-modal-body">'
    + '<div class="fc-field"><label class="fc-label">Folder Name</label><input class="fc-input" id="mName" placeholder="e.g. Meeting Notes"></div>'
    + '<div class="fc-field"><label class="fc-label">Emoji</label><input class="fc-input" id="mEmoji" value="&#128193;" style="width:60px;"></div>'
    + '<div class="fc-field"><label class="fc-label">Description</label><input class="fc-input" id="mDesc" placeholder="What goes in this folder?"></div>'
    + '<div class="fc-field"><label class="fc-label">Color</label><input class="fc-input" id="mColor" type="color" value="#6b5836" style="width:60px;height:36px;padding:2px;"></div>'
    + '</div>'
    + '<div class="fc-modal-footer">'
    + '<button class="fc-btn-ghost" id="mCancel">Cancel</button>'
    + '<button class="fc-btn" id="mSave">Create Folder</button>'
    + '</div></div></div>';

  document.getElementById("modalWrap").innerHTML = html;

  document.getElementById("modalClose").onclick = closeModal;
  document.getElementById("mCancel").onclick = closeModal;
  document.getElementById("modalBg").onclick = function(e) { if (e.target === this) closeModal(); };

  document.getElementById("mSave").onclick = async function() {
    var name = document.getElementById("mName").value.trim();
    if (!name) { toast("Name is required"); return; }
    var r = await api("POST", {
      action: "create_folder",
      name: name,
      emoji: document.getElementById("mEmoji").value || "\u{1F4C1}",
      description: document.getElementById("mDesc").value.trim(),
      color: document.getElementById("mColor").value,
    });
    if (r.ok) { toast("Folder created"); closeModal(); loadFolders(); }
  };

  document.getElementById("mName").focus();
}

async function showVersionsModal(fileId) {
  var versions = await loadVersions(fileId);
  if (!versions.length) { toast("No previous versions"); return; }

  var html = '<div class="fc-modal-bg" id="modalBg">'
    + '<div class="fc-modal">'
    + '<div class="fc-modal-head"><div class="fc-modal-title">Version History</div><button class="fc-modal-close" id="modalClose">&times;</button></div>'
    + '<div class="fc-modal-body">';

  for (var i = 0; i < versions.length; i++) {
    var v = versions[i];
    html += '<div class="fc-version" data-idx="' + i + '">'
      + '<strong>' + esc(v.title) + '</strong> &mdash; edited by ' + esc(v.edited_by) + ' on ' + formatDateFull(v.created_at)
      + '</div>';
  }

  html += '<div id="versionPreview" style="margin-top:14px;"></div>'
    + '</div>'
    + '<div class="fc-modal-footer"><button class="fc-btn-ghost" id="mCancel">Close</button></div>'
    + '</div></div>';

  document.getElementById("modalWrap").innerHTML = html;

  document.getElementById("modalClose").onclick = closeModal;
  document.getElementById("mCancel").onclick = closeModal;
  document.getElementById("modalBg").onclick = function(e) { if (e.target === this) closeModal(); };

  document.querySelectorAll(".fc-version").forEach(function(el) {
    el.onclick = function() {
      var v = versions[parseInt(el.dataset.idx)];
      document.getElementById("versionPreview").innerHTML = '<div style="font-size:12px;color:var(--text);white-space:pre-wrap;border:1px solid var(--border);padding:12px;background:var(--bg-void);max-height:300px;overflow-y:auto;">' + esc(v.content) + '</div>';
    };
  });
}

function showImportModal() {
  if (!ensureUser()) return;
  var html = '<div class="fc-modal-bg" id="modalBg">'
    + '<div class="fc-modal">'
    + '<div class="fc-modal-head"><div class="fc-modal-title">Import Files</div><button class="fc-modal-close" id="modalClose">&times;</button></div>'
    + '<div class="fc-modal-body">'
    + '<div class="fc-field"><label class="fc-label">Paste JSON array of files</label>'
    + '<textarea class="fc-textarea" id="mImport" style="min-height:160px;" placeholder=\'[{"title":"Doc Name","content":"Text here","tags":["tag1"],"folder_id":"clan-rules"}]\'></textarea></div>'
    + '<div style="font-size:11px;color:var(--text-dim);">Each object needs at least a "title". Optional: "content", "tags" (array), "folder_id" (defaults to clan-rules), "filed_by".</div>'
    + '</div>'
    + '<div class="fc-modal-footer">'
    + '<button class="fc-btn-ghost" id="mCancel">Cancel</button>'
    + '<button class="fc-btn" id="mSave">Import</button>'
    + '</div></div></div>';

  document.getElementById("modalWrap").innerHTML = html;

  document.getElementById("modalClose").onclick = closeModal;
  document.getElementById("mCancel").onclick = closeModal;
  document.getElementById("modalBg").onclick = function(e) { if (e.target === this) closeModal(); };

  document.getElementById("mSave").onclick = async function() {
    var raw = document.getElementById("mImport").value.trim();
    try {
      var files = JSON.parse(raw);
      if (!Array.isArray(files)) throw new Error("Must be an array");
      var r = await api("POST", { action: "import", files: files });
      if (r.ok) { toast("Imported " + r.imported + " files"); closeModal(); refreshAfterChange(); }
    } catch(e) {
      toast("Invalid JSON: " + e.message);
    }
  };
}

// ── Init ──

document.getElementById("addFolderBtn").onclick = showFolderModal;

document.getElementById("mobFolderToggle").onclick = function(e) {
  if (e.target.closest(".fc-mob-actions")) return;
  var list = document.getElementById("folderList");
  var toggle = document.getElementById("mobFolderToggle");
  list.classList.toggle("mob-open");
  toggle.classList.toggle("open");
};

document.getElementById("mobTrashBtn").onclick = function(e) {
  e.stopPropagation();
  state.view = "trash";
  state.expandedFile = null;
  renderSidebar();
  loadTrash();
  closeMobFolders();
};

document.getElementById("mobActivityBtn").onclick = function(e) {
  e.stopPropagation();
  state.view = "activity";
  state.expandedFile = null;
  renderSidebar();
  loadActivity();
  closeMobFolders();
};

document.getElementById("trashBtn").onclick = function() {
  state.view = "trash";
  state.expandedFile = null;
  renderSidebar();
  loadTrash();
};

document.getElementById("activityBtn").onclick = function() {
  state.view = "activity";
  state.expandedFile = null;
  renderSidebar();
  loadActivity();
};

document.getElementById("userName").onclick = function() {
  var name = prompt("Enter your name:", state.user);
  if (name && name.trim()) {
    state.user = name.trim();
    try { localStorage.setItem(USER_KEY, state.user); } catch(_) {}
    updateUserDisplay();
    toast("Name updated");
  }
};

// Deep link: #file=ID
function checkDeepLink() {
  var hash = location.hash;
  if (hash.startsWith("#file=")) {
    var fileId = hash.slice(6);
    if (fileId) {
      setTimeout(function() { loadFile(fileId); }, 500);
    }
  }
}

initAuth().then(function() {
  checkDeepLink();
});

})();
</script>
