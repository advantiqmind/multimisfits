<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grand Exchange | Multi-Misfits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Jersey+15&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
<style>
.ge-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0}
.ge-tabs{display:flex;gap:8px;flex-wrap:wrap}
.ge-tab{
  font-family:"Jersey 15",monospace;font-size:20px;line-height:1;cursor:pointer;
  color:var(--gold);border:2px solid #000;border-radius:5px;padding:11px 20px;
  background:linear-gradient(180deg,#5a4a2f,#3a2f1e);
  box-shadow:inset 0 1px 0 var(--bronze-lite), inset 0 -2px 4px rgba(0,0,0,.4);
  text-shadow:1px 1px 0 #000;white-space:nowrap;transition:transform .12s ease, filter .12s ease;
}
.ge-tab:hover{filter:brightness(1.12);transform:translateY(-1px)}
.ge-tab.active{
  color:#1a1305;font-weight:bold;
  background:linear-gradient(180deg,#ffd964,#e0a81f);
  box-shadow:inset 0 1px 0 #fff3c4, 0 0 0 1px #000, 0 0 14px rgba(255,203,47,.35);
  text-shadow:0 1px 0 rgba(255,255,255,.4);
}
.ge-credit{font-family:"Jersey 15",monospace;font-size:14px;color:var(--muted)}
.ge-credit a{color:var(--gold-dim)}
.ge-credit a:hover{color:var(--gold)}
.ge-frame{width:100%;border:none;border-radius:4px;background:transparent;height:calc(100vh - 120px)}
@media (max-width:860px){
  .ge-frame{height:calc(100vh - 110px)}
  .ge-tab{font-size:17px;padding:9px 14px}
  .ge-bar{padding:6px 0}
}
@media (max-width:480px){
  .ge-frame{height:calc(100vh - 150px)}
  .ge-tab{font-size:15px;padding:13px 14px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="discord" viewBox="0 0 71 55"><path d="M60 4.6A58 58 0 0 0 45.5.1a41 41 0 0 0-2 4.2 54 54 0 0 0-16 0 41 41 0 0 0-2-4.2A58 58 0 0 0 11 4.6 60 60 0 0 0 .6 45.3a58 58 0 0 0 17.7 9 44 44 0 0 0 3.8-6.2 38 38 0 0 1-6-2.9l1.5-1.1a41 41 0 0 0 35 0l1.5 1.1a38 38 0 0 1-6 2.9 44 44 0 0 0 3.8 6.2 58 58 0 0 0 17.7-9A60 60 0 0 0 60 4.6ZM23.7 36.5c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2 6.5 3.3 6.4 7.2c0 4-2.8 7.2-6.4 7.2Zm23.6 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2 6.5 3.3 6.4 7.2c0 4-2.8 7.2-6.4 7.2Z"/></symbol>
</svg>

<header>
  <div class="bar">
    <a class="brand" href="/">
      <img class="crest" src="/assets/crest.png" alt="Multi-Misfits crest">
      <span><b>MULTI-MISFITS</b><small>OSRS CLAN</small></span>
    </a>

    <nav class="main" id="nav">
      <a href="/">Home</a>
      <a href="/events.html">Events</a>
      <a href="/achievements.html">Achievements</a>
      <a href="/gallery.html">Gallery</a>
      <a href="/faq.html">FAQ</a>
      <a href="/ge.html">Grand Exchange</a>
    </nav>

    <button class="hamburger" id="burger" aria-label="Menu">≡</button>

    <div class="actions">
      <a class="btn icon-coin" href="/ge.html">Grand Exchange</a>
      <a class="btn" href="/roster.html">Leaderboard</a>
      <a class="btn join" data-discord href="#" aria-label="Join our Discord"><svg fill="#1a1305" aria-hidden="true"><use href="#discord"/></svg>JOIN</a>
    </div>
  </div>
</header>

<main style="padding-top:8px;padding-bottom:8px">
  <div class="ge-bar">
    <div class="ge-tabs">
      <button class="ge-tab active" data-ge="live">GE Lookup</button>
      <button class="ge-tab" data-ge="practice">Practice Simulator</button>
    </div>
    <div class="ge-credit">Powered by <a href="https://1box.online/tools/osrs-ge/" target="_blank" rel="noopener">1Box.online</a></div>
  </div>
  <iframe id="ge-frame" class="ge-frame" src="https://1box.online/tools/osrs-ge/" title="Grand Exchange Tool" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" loading="lazy"></iframe>
</main>

<div id="toast"></div>

<script>
(function(){
  var tabs = document.querySelectorAll('.ge-tab');
  var frame = document.getElementById('ge-frame');
  var urls = { live: 'https://1box.online/tools/osrs-ge/', practice: 'https://1box.online/tools/osrs-ge/practice' };

  var mmTheme = {
    bg: "#0d0b08",
    panel: "#2b2419",
    panel2: "#3a3020",
    border: "#6b5836",
    text: "#e6d9b8",
    muted: "#a99b78",
    dim: "#8a7449",
    neon: "#ffcb2f",
    neon2: "#c9a227",
    danger: "#b23a30",
    warn: "#ffcb2f"
  };

  function applyTheme() {
    if (!frame.contentWindow) return;
    frame.contentWindow.postMessage({ type: "ge-theme", colors: mmTheme }, "*");
  }

  frame.addEventListener("load", applyTheme);

  tabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      tabs.forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      var src = urls[tab.dataset.ge];
      if (frame.src !== src) frame.src = src;
    });
  });
})();
</script>

</body>
</html>
